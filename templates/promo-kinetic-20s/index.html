<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Kinetic promo replica</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Sans"; src: url(assets/fonts/Inter.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Serif"; src: url(assets/fonts/InstrumentSerif-italic-400.woff2) format("woff2"); font-style: italic; }
@font-face { font-family: "Mono"; src: url(assets/fonts/JetBrainsMono-normal-400.woff2) format("woff2"); font-weight: 400; }
:root { --cream: #fcf8ed; --ink: #1a1714; --coral: #d95640; --coral-t: #c9604f; --dark: #0e0d09; --tag: #a01744; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--dark); }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Sans", sans-serif; }
.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
.bg-cream { background: var(--cream); }
.bg-dark { background: var(--dark); }

/* kinetic text line: centred at (cx, cy) */
.tl-wrap { position: absolute; left: 0; width: 1920px; display: flex; justify-content: center; align-items: center; }
.line { display: block; white-space: nowrap; font-weight: 450; letter-spacing: -0.01em; color: var(--ink); transform-origin: 50% 50%; }
.dark .line { color: #f4efe6; }
.w { display: inline-block; }
.w.serif { font-family: "Serif", serif; font-style: italic; font-weight: 400; letter-spacing: 0; font-size: 1.12em; }
.w.hide { visibility: hidden; }
.w.coral { color: var(--coral-t); }
.glyph { color: var(--coral-t); letter-spacing: .06em; font-weight: 500; }

/* particles / pixels */
.px { position: absolute; width: 13px; height: 13px; background: var(--coral); }
.px.tall { height: 26px; }
.px.wide { width: 26px; }
.pc { position: absolute; font-family: "Sans"; font-size: 44px; font-weight: 400; line-height: 1; }
.dither { position: absolute; width: 48px; height: 48px; background: #f3c7bc; }
.dotgrid { background-color: #f1ebe0;
  background-image: linear-gradient(90deg, var(--cream) 7px, transparent 7px), linear-gradient(var(--cream) 7px, transparent 7px);
  background-size: 14px 14px; }
.pixring { position: absolute; }
.pixring i { position: absolute; display: block;
  background: conic-gradient(from 270deg at var(--sq) var(--sq), var(--rc) 90deg, transparent 0) 0 0 / var(--pitch) var(--pitch); }
.dotcell { position: absolute; width: 21px; height: 21px; background: #f1ebe1; }

/* scene 2 tiles */
.tile { position: absolute; border-radius: 22%; }
.tile .glass { position: absolute; inset: 0; border-radius: 22%; background: linear-gradient(160deg, #1d1715, #120e0c);
  box-shadow: inset 0 0 0 1.5px rgba(217, 86, 64, .55), 0 10px 40px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
.tile .glass svg { width: 52%; height: 52%; }
.tile .mosaic { position: absolute; inset: 0; border-radius: 22%;
  background: linear-gradient(160deg, #f59a85, #e9806a 55%, #d8654f); }
.tile .blurry { position: absolute; inset: -6%; border-radius: 26%; background: linear-gradient(135deg, #f3a18a, #d9624b); filter: blur(10px); }
.glow-red { position: absolute; border-radius: 50%; filter: blur(140px); }

/* scene 6 cards */
.card { position: absolute; left: 0; width: 1080px; height: 176px; border-radius: 20px; background: #fbf6ee;
  box-shadow: 0 10px 30px rgba(120, 30, 20, .18); display: flex; align-items: center; padding: 0 40px; gap: 26px; }
.card .ic { width: 44px; height: 44px; border-radius: 11px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.card b { display: block; font-weight: 500; font-size: 33px; color: #2a2522; letter-spacing: -0.01em; }
.card small { display: block; font-size: 24px; color: #a79e94; margin-top: 6px; }

/* scene 7 terminal */
.term { position: absolute; left: 580px; top: 200px; width: 760px; height: 780px; border-radius: 16px; background: #15110f;
  box-shadow: inset 0 0 0 1.5px rgba(217, 86, 64, .35); overflow: hidden; }
.term .bar { position: absolute; top: 0; left: 0; right: 0; height: 40px; border-bottom: 1px solid rgba(255,255,255,.06);
  font: 400 15px "Mono"; color: #8d8580; text-align: center; line-height: 40px; background: #15110f; z-index: 2; }
.term .body { position: absolute; left: 34px; top: 60px; width: 690px; font: 400 20px/37px "Mono"; color: #cfc6bd; white-space: pre; }
.term .body .d { color: #f4c542; } .term .body .dim { color: #7c736b; } .term .body .hl { color: #fff; }
.term .input { position: absolute; left: 24px; right: 24px; bottom: 22px; height: 44px; border-radius: 8px; border: 1px solid rgba(255,255,255,.12);
  background: #15110f; z-index: 2; font: 400 18px/44px "Mono"; color: #7c736b; padding-left: 14px; }
.tag { position: absolute; height: 70px; padding: 0 26px 0 20px; border-radius: 9px; background: rgba(110, 10, 38, .85);
  box-shadow: inset 0 0 0 1.5px var(--tag); display: flex; align-items: center; gap: 14px; font: 500 30px "Mono"; color: #ff3d6e; white-space: nowrap; }
.tag .o { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid #ff3d6e; font-size: 17px; line-height: 23px; text-align: center; }

/* scene 8 */
.gh { position: absolute; width: 310px; height: 310px; border-radius: 72px; background: #fff;
  box-shadow: 0 0 0 1.5px #f1d7cf, 0 14px 40px rgba(217, 86, 64, .18); display: flex; align-items: center; justify-content: center; }
.cursor { position: absolute; width: 50px; height: 50px; }
.cursor svg { width: 50px; height: 50px; }
.you { position: absolute; left: 44px; top: 44px; background: #111; color: #fff; font-size: 28px; font-weight: 500; padding: 7px 18px; border-radius: 20px; }
.win { position: absolute; background: #fbf8f2; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 1.5px #e9e1d6, 0 30px 80px rgba(60,30,20,.12); }
.win .hdr { position: absolute; left: 0; right: 0; top: 0; height: 84px; background: #16120f; }
.pill { position: absolute; background: #fff; border-radius: 18px; font-weight: 450; color: #1a1714; white-space: nowrap; display: flex; align-items: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080"></div>
<script>
/* ============================================================================================
   Replica of the first 20s of 7lA1EtPhxXQxxCtj.mp4 (24 fps). All times below are source frames/24.
   Icons are generic stand-ins (no third-party logos); copy lives in COPY for easy re-skinning.
   ============================================================================================ */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");
const f = n => (n - 1) / 24;                       // source frame number -> seconds
const C = { coral: "#c9604f", coralPx: "#d95640", ink: "#1a1714", white: "#f4efe6", yellow: "#e2cf3a" };
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
let track = 1, uid = 0;
function clip(t0, t1, html, cls = "", style = "") {
  const d = document.createElement("div");
  d.className = "clip " + cls; d.id = "c" + (uid++);
  d.dataset.start = t0.toFixed(3); d.dataset.duration = Math.max(0.04, t1 - t0).toFixed(3); d.dataset.trackIndex = String(track++);
  if (style) d.setAttribute("style", style);
  d.innerHTML = html; root.appendChild(d); return d;
}
function el(parent, tag, cls, style, html) {
  const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.setAttribute("style", style);
  if (html != null) e.innerHTML = html; parent.appendChild(e); return e;
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ---- kinetic line states --------------------------------------------------------------------
   tokens: [text, flags]  flags: n=new word (enters coral, off-baseline, settles), c=stays coral,
   s=serif italic, h=hidden (keeps its space), g=glyph noise, L/R=wide gap after/before; dy = entry offset in em          */
function lineStates(states, tEnd, o) {
  const out = [];
  states.forEach((st, i) => {
    const t0 = st.t, t1 = i + 1 < states.length ? states[i + 1].t : tEnd;
    const spans = st.tok.map((tk, k) => {
      const [txt, fl = "", dy = 0] = tk; const cls = ["w"];
      if (fl.includes("s")) cls.push("serif"); if (fl.includes("h")) cls.push("hide");
      if (fl.includes("c") || fl.includes("n")) cls.push("coral"); if (fl.includes("g")) cls.push("glyph");
      const sty = fl.includes("L") ? ' style="margin-right:110px"' : fl.includes("R") ? ' style="margin-left:110px"' : "";
      return `<span class="${cls.join(" ")}"${sty} data-fl="${fl}" data-dy="${dy}">${esc(txt)}</span>`;
    }).join(" ");
    const c = clip(t0, t1, `<div class="tl-wrap" style="top:${(o.cy || 540) - 100}px;height:200px"><div class="line" style="font-size:${o.size}px">${spans}</div></div>`,
      "full" + (o.dark ? " dark" : ""));
    const line = c.querySelector(".line");
    if (o.scale) tl.fromTo(line, { scale: o.scale(t0), y: o.drift ? o.drift(t0) : 0 }, { scale: o.scale(t1), y: o.drift ? o.drift(t1) : 0, duration: t1 - t0, ease: "none" }, t0);
    line.querySelectorAll(".w").forEach(w => {
      const fl = w.dataset.fl, dy = +w.dataset.dy;
      if (fl.includes("n")) {
        const settle = st.settle != null ? st.settle : 0.06;
        tl.fromTo(w, { y: dy * o.size, opacity: 0 }, { opacity: 1, duration: 1 / 24, ease: "none" }, t0);
        tl.to(w, { y: 0, duration: 0.14, ease: "power2.out" }, t0 + settle);
        if (!fl.includes("c")) tl.to(w, { color: o.dark ? C.white : C.ink, duration: 0.1, ease: "none" }, t0 + settle + 0.04);
      }
    });
    out.push(c);
  });
  return out;
}

/* ---- jumping coral pixel squares ---- */
function pixels(t0, t1, n, seed, box, step = 0.17, parentCls = "full") {
  const r = rng(seed), c = clip(t0, t1, "", parentCls, "pointer-events:none");
  for (let i = 0; i < n; i++) {
    const p = el(c, "div", "px" + (r() < 0.2 ? " tall" : r() < 0.15 ? " wide" : ""));
    const pos = () => ({ x: box[0] + r() * (box[2] - box[0]), y: box[1] + r() * (box[3] - box[1]) });
    let t = t0 + r() * 0.25; const a = pos(); tl.set(p, { x: a.x, y: a.y, opacity: 0 }, t0); tl.set(p, { opacity: 1 }, t);
    while (t < t1) {
      t += step * (0.6 + r() * 1.4);
      if (r() < 0.55) { const b = pos(); tl.set(p, { x: b.x, y: b.y, opacity: r() < 0.85 ? 1 : 0 }, t); }
    }
  }
  return c;
}

/* ---- drifting code-punctuation particles ---- */
function particles(t0, t1, n, seed, cx, cy, spread, outward) {
  const r = rng(seed), c = clip(t0, t1, "", "full");
  const chars = ["}", "{", "\\", "*", ")", "}", "*"], cols = [C.ink, C.coral, C.yellow, C.ink];
  for (let i = 0; i < n; i++) {
    const ang = r() * Math.PI * 2, rad = spread[0] + r() * (spread[1] - spread[0]);
    const x = cx + Math.cos(ang) * rad * 2.4, y = cy + Math.sin(ang) * rad * 1.1;
    const p = el(c, "div", "pc", `color:${cols[i % cols.length]}`, chars[Math.floor(r() * chars.length)]);
    const a = t0 + r() * 0.35, life = 0.35 + r() * 0.8;
    tl.set(p, { x, y, opacity: 0 }, t0);
    tl.set(p, { opacity: 1 }, a);
    tl.to(p, { x: x + Math.cos(ang) * outward, y: y + Math.sin(ang) * outward * 0.6, duration: t1 - a, ease: "none" }, a);
    if (a + life < t1 - 0.1 && r() < 0.6) { tl.set(p, { opacity: 0 }, a + life); tl.set(p, { opacity: 1 }, a + life + 0.12 + r() * 0.3); }
  }
}

/* ---- pixel ring (band of squares around a rect) ---- */
function pixRing(parent, ix, iy, iw, ih, th, color, sq = 17, pitch = 27) {
  const g = el(parent, "div", "pixring", `left:0;top:0;width:1920px;height:1080px;--rc:${color};--sq:${sq}px;--pitch:${pitch}px`);
  const band = (l, t, w, h) => el(g, "i", "", `left:${l}px;top:${t}px;width:${w}px;height:${h}px`);
  const snap = v => Math.round(v / pitch) * pitch;
  band(snap(ix - th), snap(iy - th), snap(iw + 2 * th), snap(th));          // top
  band(snap(ix - th), snap(iy + ih), snap(iw + 2 * th), snap(th));          // bottom
  band(snap(ix - th), snap(iy), snap(th), snap(ih));                        // left
  band(snap(ix + iw), snap(iy), snap(th), snap(ih));                        // right
  return g;
}

/* ---- icons (generic stand-ins) ---- */
const ICON = {
  burst: `<svg viewBox="0 0 100 100"><g stroke="#e3765f" stroke-width="7" stroke-linecap="round">${[0,30,60,90,120,150].map(a=>`<line x1="50" y1="12" x2="50" y2="88" transform="rotate(${a} 50 50)"/>`).join("")}</g></svg>`,
  knot: `<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="6">${[0,60,120].map(a=>`<ellipse cx="50" cy="50" rx="36" ry="16" transform="rotate(${a} 50 50)"/>`).join("")}</svg>`,
  inf: `<svg viewBox="0 0 100 100" fill="none" stroke="#1c7cf4" stroke-width="9"><path d="M50 50c-10-16-30-18-34-2s18 22 34 2c16-20 38-14 34 2s-24 14-34-2z"/></svg>`,
  wave: `<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"><path d="M14 34l14 34 12-26 12 26 12-26 12 26 10-34"/></svg>`,
  cube: `<svg viewBox="0 0 100 100"><path d="M50 12l34 18v40L50 88 16 70V30z" fill="#9c9a97"/><path d="M50 12l34 18-34 18-34-18z" fill="#d6d4d1"/><path d="M50 48v40L16 70V30z" fill="#6f6d6a"/></svg>`,
  spark: `<svg viewBox="0 0 100 100"><defs><linearGradient id="gsp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c343"/><stop offset=".45" stop-color="#e2507a"/><stop offset="1" stop-color="#3f7cf6"/></linearGradient></defs><path d="M50 8c4 24 18 38 42 42-24 4-38 18-42 42-4-24-18-38-42-42 24-4 38-18 42-42z" fill="url(#gsp)"/></svg>`,
  dots: `<svg viewBox="0 0 100 100">${[[50,22],[74,36],[74,64],[50,78],[26,64],[26,36],[50,50]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="11" fill="${i%2?'#27c3a0':'#3f8cf6'}"/>`).join("")}</svg>`,
  bot: `<svg viewBox="0 0 100 100"><rect x="18" y="26" width="64" height="52" rx="18" fill="#e8e3de"/><circle cx="38" cy="52" r="7" fill="#15110f"/><circle cx="62" cy="52" r="7" fill="#15110f"/><rect x="46" y="12" width="8" height="16" rx="4" fill="#e8e3de"/></svg>`,
  txt: `<svg viewBox="0 0 100 100"><text x="50" y="58" text-anchor="middle" font-family="Mono" font-size="15" fill="#e8e3de">opencode</text></svg>`,
  branch: `<svg viewBox="0 0 100 100" fill="none" stroke="#d95640" stroke-width="9" stroke-linecap="round"><circle cx="30" cy="24" r="10"/><circle cx="30" cy="78" r="10"/><circle cx="72" cy="36" r="10"/><path d="M30 34v34M72 46c0 16-20 18-38 26"/></svg>`,
};

/* =========================================== SCENE 1 (f1–43) =========================================== */
const S1 = [0, f(44)];
clip(S1[0], S1[1], "", "full bg-cream");
{ // pink dither corners (f5–25): blocky squares, denser toward the corners
  const c = clip(f(4), f(30), "", "full"); const r = rng(11);
  for (let gx = 0; gx < 40; gx++) for (let gy = 0; gy < 23; gy++) {
    const dTR = Math.hypot((39 - gx) / 17, gy / 12), dBL = Math.hypot(gx / 15, (22 - gy) / 10), d = Math.min(dTR, dBL);
    const a = Math.max(0, 1 - d) * (0.35 + r() * 0.65); if (a < 0.08) continue;
    el(c, "div", "dither", `left:${gx * 48}px;top:${gy * 48}px`).dataset.o = Math.min(1, a * 1.05).toFixed(2);
  }
  const g = c; tl.fromTo(g.children, { opacity: 0 }, { opacity: (i, t) => +t.dataset.o, duration: 0.2, stagger: { each: 0.0015, from: "random" } }, f(4));
  tl.to(g.children, { opacity: 0, duration: 0.35, stagger: { each: 0.001, from: "random" } }, f(18));
}
pixels(f(5), S1[1], 7, 21, [180, 180, 1760, 900], 0.16);
{
  const scale = t => t < f(3) ? 1.75 : 1.75 - 0.75 * gsap.parseEase("power2.inOut")(Math.min(1, (t - f(3)) / (f(26) - f(3))));
  const drift = t => -26 * Math.min(1, t / S1[1]);
  lineStates([
    { t: f(3), tok: [["Engineers", "n", 0]] },
    { t: f(13), tok: [["Engineers"], ["are", "n", 0.45]] },
    { t: f(17), tok: [["Engineers"], ["are"], ["shipping", "n", 0.2]] },
    { t: f(19), tok: [["Engineers"], ["are"], ["shipping"], ["everyday", "n", 0.35]] },
    { t: f(27), tok: [["Engineers"], ["are"], ["shipping"], ["everyday", "s"]] },
  ], S1[1], { size: 46, cy: 548, scale, drift });
}

/* =========================================== SCENE 2 (f44–108) =========================================== */
const S2 = [f(44), f(109)];
{
  const c = clip(S2[0], S2[1], `<div class="glow-red" style="left:260px;top:760px;width:1400px;height:520px;background:#6e1a10;opacity:.55"></div>`, "full bg-dark");
  // tiles: measured screen positions (fraction of frame) at f56, f68, f80, f92, f104, f108 — the cluster orbits clockwise
  const T = [f(56), f(68), f(80), f(92), f(104), f(108)];
  const tiles = [
    { ic: "wave",  sz: 200, p: [[.045,.575],[.14,.48],[.21,.41],[.315,.33],[.486,.20],[.62,.13]], born: f(46) },
    { ic: "burst", sz: 290, p: [[.69,.645],[.535,.75],[.444,.80],[.324,.84],[.15,.91],[.04,.91]], born: f(46) },
    { ic: "knot",  sz: 280, p: [[.946,.43],[.856,.53],[.787,.59],[.685,.68],[.51,.80],[.38,.88]], born: f(48) },
    { ic: "txt",   sz: 150, p: [[.64,.19],[.80,.13],[.877,.12],[.97,.11],[1.08,.1],[1.12,.1]], born: f(50) },
    { ic: "inf",   sz: 170, p: [[.40,.36],[.465,.25],[.555,.20],[.676,.16],[.85,.09],[.97,.05]], born: f(52) },
    { ic: "cube",  sz: 240, p: [[.30,.97],[.195,.87],[.12,.88],[.02,.95],[-.1,1.0],[-.14,1.0]], born: f(50) },
    { ic: "bot",   sz: 210, p: [[.02,.86],[-.02,.7],[-.08,.6],[-.16,.5],[-.25,.4],[-.3,.36]], born: f(48) },
    { ic: "dots",  sz: 220, p: [[-.12,.8],[-.06,.72],[.015,.63],[.036,.58],[.13,.44],[.23,.34]], born: f(66) },
    { ic: "spark", sz: 250, p: [[1.1,.3],[1.06,.36],[1.02,.4],[.967,.43],[.87,.57],[.78,.67]], born: f(82) },
  ];
  tiles.forEach((d, i) => {
    const sz = Math.round(d.sz * 1.2); const t = el(c, "div", "tile", `left:${-sz / 2}px;top:${-sz / 2}px;width:${sz}px;height:${sz}px`);
    el(t, "div", "glass", "", ICON[d.ic]); const mo = el(t, "div", "mosaic"); const bl = el(t, "div", "blurry");
    const X = p => p[0] * 1920, Y = p => p[1] * 1080;
    // fly in from the camera: big, blurred coral block -> coral mosaic -> resolved glass tile
    const p0 = d.p[0], out = [(p0[0] - .5) * 1.35 + .5, (p0[1] - .5) * 1.35 + .5];
    tl.set(t, { x: X(out), y: Y(out), scale: 1.9, opacity: 0 }, S2[0]);
    tl.to(t, { opacity: 1, duration: 0.12 }, d.born);
    tl.to(t, { x: X(p0), y: Y(p0), scale: 1, duration: Math.max(0.2, T[0] - d.born), ease: "power2.out" }, d.born);
    tl.fromTo(bl, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.in" }, d.born + 0.05);
    const res = Math.max(d.born + 0.25, T[0] - 0.05) + i * 0.04;
    tl.fromTo(mo, { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "steps(4)" }, res);
    for (let k = 1; k < T.length; k++)
      tl.to(t, { x: X(d.p[k]), y: Y(d.p[k]), duration: T[k] - T[k - 1], ease: "none" }, T[k - 1]);
  });
  // "with AI"
  const w = el(c, "div", "tl-wrap", "top:440px;height:200px", `<div class="line" style="font-size:44px;color:#f4efe6"><span class="w" id="s2with">with</span> <span class="w" id="s2ai" style="color:${C.coral}">AI</span></div>`);
  tl.fromTo("#s2with", { opacity: 0 }, { opacity: 1, duration: 0.08 }, f(44));
  tl.fromTo("#s2ai", { opacity: 0 }, { opacity: 1, duration: 0.08 }, f(46));
  tl.to("#s2with", { y: -18, duration: 0.12, ease: "power2.in" }, f(105));
  tl.to("#s2ai", { y: 26, duration: 0.12, ease: "power2.in" }, f(105));
}
pixels(f(54), S2[1], 12, 31, [300, 150, 1650, 950], 0.12);

/* =========================================== SCENE 3 (f109–256) =========================================== */
const S3 = [f(109), f(257)];
clip(S3[0], S3[1], "", "full bg-cream");

<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Site Privacy</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Inter"; src: url(assets/fonts/Inter.woff2) format("woff2"); font-weight: 100 900; }
:root { --bg: #F6F5F1; --ink: #1D1D1F; --soft: #8C8C90; --Y: #EFC53F; --L: #DCE36A; --B: #4767D9; --LB: #8FAEEA; --R: #E0473F; --P: #5B1C40; --G: #2E6B3E; --M: #C9DDD6; --geo: #33C25A; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); font-family: "Inter", sans-serif; color: var(--ink); }
.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
.clip { z-index: 2; } .clip.under { z-index: 0; }
.abs { position: absolute; }
.cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
.vlayer { position: absolute; overflow: hidden; z-index: 1; opacity: 0; }
.vlayer video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
/* type: small, calm, centred (the shapes do the shouting) */
.line { position: absolute; left: 0; top: 0; width: 1920px; display: flex; justify-content: center; align-items: center; white-space: nowrap; font-weight: 500; letter-spacing: -0.02em; }
.it { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.slot { overflow: visible; }
.ph { border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.14); background: #ddd; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card { position: absolute; background: #fff; border-radius: 16px; box-shadow: 0 18px 44px rgba(30,30,40,.12); overflow: hidden; }
.glass { position: absolute; background: rgba(28,29,33,.78); border: 1px solid rgba(255,255,255,.09); border-radius: 22px; color: #F2F2F4; box-shadow: 0 30px 80px rgba(0,0,0,.35); backdrop-filter: blur(18px); }
.row { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 28px; font-size: 24px; color: #EDEDF0; }
.row .lbl { flex: 1; white-space: nowrap; }
.beta { font-size: 14px; font-weight: 600; letter-spacing: .08em; color: #8CA9FF; border: 1px solid #5470C4; border-radius: 5px; padding: 3px 8px; }
.tg { width: 56px; height: 32px; border-radius: 16px; background: #55565D; position: relative; flex: none; }
.tg.on { background: #3B6CF6; }
.tg i { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; }
.tg.on i { transform: translateX(24px); }
.pill { position: absolute; display: flex; align-items: center; gap: 18px; height: 92px; padding: 0 30px 0 34px; border-radius: 46px; background: #ECEBE6; font-size: 34px; font-weight: 500; white-space: nowrap; }
.pill .tg { width: 104px; height: 60px; border-radius: 30px; background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.pill .tg i { width: 50px; height: 50px; top: 5px; left: 5px; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.18); }
.rl-line { position: absolute; left: 0; width: 1920px; text-align: center; font-size: 44px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; }
.step { font-size: 30px; display: flex; align-items: center; gap: 14px; color: #6F6F74; }
.step b { color: var(--ink); font-weight: 500; }
.bubble { position: absolute; padding: 20px 28px; border-radius: 22px; background: #E9E7E1; font-size: 30px; font-weight: 500; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 12px; height: 64px; padding: 0 26px; border-radius: 32px; background: #fff; font-size: 26px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.08); white-space: nowrap; }
.chip i { width: 14px; height: 14px; border-radius: 50%; display: block; }
.ccard { position: absolute; left: -170px; width: 340px; height: 92px; border-radius: 16px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.08); display: flex; align-items: center; gap: 18px; padding: 0 22px; }
.ccard small { display: block; font-size: 13px; color: #66666C; letter-spacing: .02em; }
.ccard b { display: block; font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
.note { position: absolute; display: flex; align-items: center; gap: 18px; font-size: 26px; color: #E9E9EC; height: 60px; padding: 0 22px; border-radius: 14px; background: rgba(255,255,255,.06); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="70" data-width="1920" data-height="1080">
  <!-- footage: authored statically (the renderer pre-extracts frames from markup); the script only places and moves them -->
  <div id="vl-reach" class="vlayer"><video id="v-reach" src="assets/clips/reach.mp4" data-start="12.2" data-duration="4.0" data-media-start="0.3" data-track-index="40" muted playsinline></video></div>
  <div id="vl-zones_on" class="vlayer"><video id="v-zones_on" src="assets/clips/zones_on.mp4" data-start="16.2" data-duration="2.0" data-media-start="0.1" data-track-index="41" muted playsinline></video></div>
  <div id="vl-tracking" class="vlayer"><video id="v-tracking" src="assets/clips/tracking.mp4" data-start="34.4" data-duration="3.6" data-media-start="0.4" data-track-index="42" muted playsinline></video></div>
  <div id="vl-outside" class="vlayer"><video id="v-outside" src="assets/clips/outside.mp4" data-start="38.0" data-duration="2.3" data-media-start="1.2" data-track-index="43" muted playsinline></video></div>
  <div id="vl-swingback" class="vlayer"><video id="v-swingback" src="assets/clips/swingback.mp4" data-start="40.3" data-duration="2.1" data-media-start="0.3" data-track-index="44" muted playsinline></video></div>
</div>
<script>
/* =============================================================================================
   Site Privacy — light motion-graphics product film (70 s). Structure mirrors the reference
   launch film beat for beat: collage opener · inline-photo sentence · lockup · word-split
   carousel · shape-swirl morph · mascot-cursor UI · rolodex text · clutter toggle → zoom-through ·
   thinking steps · footage cards · carousel · hopping steps · glass notes · word-pill finale.
   ============================================================================================= */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");
const FPS = 30;
const OFF = 0, DUR = 70;                                         // render slice (part files override this line)
let track = 1, uid = 0;
const C = { Y: "#EFC53F", L: "#DCE36A", B: "#4767D9", LB: "#8FAEEA", R: "#E0473F", P: "#5B1C40", G: "#2E6B3E", M: "#C9DDD6", W: "#FBF8E8" };
function clip(t0, t1, under = false) {
  const d = document.createElement("div");
  d.className = "clip full" + (under ? " under" : ""); d.id = "s" + (uid++);
  let s0 = Math.max(0, t0 - OFF - 0.001), e0 = t1 - OFF - 0.001;
  if (e0 <= 0 || s0 >= DUR) { s0 = DUR + 5; e0 = DUR + 6; }          // outside this render slice: never shown
  d.dataset.start = s0.toFixed(4); d.dataset.duration = Math.max(0.034, e0 - s0).toFixed(4); d.dataset.trackIndex = String(track++);
  root.appendChild(d); return d;
}
function el(parent, tag, cls, style, html) {
  const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.setAttribute("style", style);
  if (html != null) e.innerHTML = html; parent.appendChild(e); return e;
}
const img = n => `assets/img/${n}.jpg`;
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
/* per-frame driver: props are functions of absolute time */
function drive(target, t0, t1, props) {
  const at = t => { const o = {}; for (const k in props) o[k] = props[k](t); return o; };
  tl.set(target, at(t0), t0);
  const n = Math.round((t1 - t0) * FPS);
  for (let i = 0; i < n; i++) { const a = t0 + i / FPS, b = t0 + (i + 1) / FPS; tl.to(target, { ...at(b), duration: 1 / FPS, ease: "none" }, a); }
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

/* ---- flat shapes (rounded via a fat same-colour stroke) ---------------------------------- */
function polyPts(n, r, rot = 0, cx = 0, cy = 0) {
  return Array.from({ length: n }, (_, i) => { const a = rot + i * 2 * Math.PI / n; return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
}
function shapeSVG(kind, size, color) {
  const s = size, h = s / 2, r = h * 0.78, sw = s * 0.16;
  const inner = {
    hex: `<polygon points="${polyPts(6, r, Math.PI / 6, h, h)}" fill="${color}" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`,
    oct: `<polygon points="${polyPts(8, r, Math.PI / 8, h, h)}" fill="${color}" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`,
    sq: `<rect x="${s * .14}" y="${s * .14}" width="${s * .72}" height="${s * .72}" rx="${s * .18}" fill="${color}"/>`,
    dia: `<polygon points="${polyPts(4, r, 0, h, h)}" fill="${color}" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`,
    circ: `<circle cx="${h}" cy="${h}" r="${h * .9}" fill="${color}"/>`,
    blob: `<path d="M${s*.2},${s*.15} C${s*.6},${s*.0} ${s*.95},${s*.2} ${s*.88},${s*.55} C${s*.82},${s*.9} ${s*.4},${s*.98} ${s*.15},${s*.8} C${-s*.02},${s*.62} ${-s*.02},${s*.28} ${s*.2},${s*.15}Z" fill="${color}"/>`,
  }[kind];
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="overflow:visible;display:block">${inner}</svg>`;
}
function shape(parent, kind, size, color, x, y, style = "") {
  return el(parent, "div", "abs", `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;${style}`, shapeSVG(kind, size, color));
}
/* ---- mascot: the "privacy lens" (yellow hexagon ring, soft lens inside) ------------------- */
function mascotSVG(size, ring = C.Y) {
  const h = size / 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="overflow:visible;display:block">
    <polygon points="${polyPts(6, h * .74, Math.PI / 6, h, h)}" fill="#fff" fill-opacity=".95" stroke="${ring}" stroke-width="${size * .15}" stroke-linejoin="round"/>
    <circle cx="${h}" cy="${h}" r="${h * .3}" fill="${ring}" opacity=".35"/><circle cx="${h}" cy="${h}" r="${h * .17}" fill="${ring}"/></svg>`;
}
function mascot(parent, size, x, y) {
  const m = el(parent, "div", "abs", `left:${-size / 2}px;top:${-size / 2}px;width:${size}px;height:${size}px;z-index:30;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))`, mascotSVG(size));
  gsap.set(m, { x, y }); return m;
}
function ping(parent, x, y, t, color = "#fff") {
  const r = el(parent, "div", "abs", `left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:3px solid ${color};box-shadow:0 0 22px ${color};z-index:29;opacity:0`);
  tl.fromTo(r, { x, y, scale: .55, opacity: .7 }, { scale: 1.15, opacity: 0, duration: .6, ease: "power2.out" }, t);
}
function tap(m, t) { tl.to(m, { scale: .88, duration: .1, ease: "power2.inOut" }, t); tl.to(m, { scale: 1, duration: .3, ease: "power3.out" }, t + .1); }

/* ---- kinetic line with inline slots: words reflow as photos open (transforms only) -------- */
function sentence(parent, y, size, items, opts = {}) {
  // items: ["word", {img, w, h, at}] ; words reveal on opts.t + i*stagger
  const line = el(parent, "div", "line", `top:${y - size}px;height:${size * 2}px;font-size:${size}px;gap:${size * .32}px`);
  const parts = items.map(it => {
    if (typeof it === "string") return { e: el(line, "span", "it", "", it), w: 0 };
    const s = el(line, "div", "it slot", `width:${it.w}px;height:${it.h}px`);
    const ph = el(s, "div", "ph", `width:${it.w}px;height:${it.h}px`); el(ph, "img").src = img(it.img);
    return { e: s, ph, w: it.w + size * .32, at: it.at, rot: it.rot ?? 0 };
  });
  const slots = parts.filter(p => p.w);
  const offs = opened => parts.map((p, k) => {
    let before = 0, total = 0;
    slots.forEach(s => { if (!opened.has(s)) { total += s.w; if (parts.indexOf(s) < k) before += s.w; } });
    return -before + total / 2;
  });
  const opened = new Set();
  parts.forEach((p, k) => gsap.set(p.e, { x: offs(opened)[k] }));
  slots.forEach(s => gsap.set(s.ph, { scale: 0, opacity: 0, rotation: s.rot - 5 }));
  [...slots].sort((a, b) => a.at - b.at).forEach(s => {
    opened.add(s); const o = offs(new Set(opened));
    parts.forEach((p, k) => tl.to(p.e, { x: o[k], duration: .32, ease: "power3.out" }, s.at));
    tl.fromTo(s.ph, { scale: .62, opacity: 0 }, { scale: 1, opacity: 1, rotation: s.rot, duration: .22, ease: "power4.out" }, s.at);
    tl.to(s.ph, { rotation: s.rot + (s.rot >= 0 ? 2.5 : -2.5), y: -6, duration: 2.2, ease: "sine.inOut" }, s.at + .22);
  });
  if (opts.t != null) parts.filter(p => !p.w).forEach((p, i) =>
    tl.fromTo(p.e, { opacity: 0 }, { opacity: 1, duration: .12, ease: "power1.out" }, opts.t + i * (opts.stagger ?? .12)));
  return line;
}
function words(parent, y, size, text, t, stagger = .09, style = "") {
  const line = el(parent, "div", "line", `top:${y - size}px;height:${size * 2}px;font-size:${size}px;${style}`);
  const ws = text.split(" ").map((w, i, a) => el(line, "span", "it", "", w + (i < a.length - 1 ? "&nbsp;" : "")));
  tl.fromTo(ws, { opacity: 0, y: size * .12 }, { opacity: 1, y: 0, duration: .14, ease: "power2.out", stagger }, t);
  return { line, ws };
}
/* ---- stepped 3D carousel: each card rolls up with eased weight, settles, holds in focus ---------- */
function carousel(cam, items, t0, t1, period, rollFrac) {
  const wheel = el(cam, "div", "abs", "left:960px;top:540px;width:0;height:0;perspective:900px;transform:scale(1.3)");
  const cs = [...items, ...items].map(([t, sub, k, c]) => el(wheel, "div", "ccard", "top:-50px;left:-230px;width:460px;height:100px", `${shapeSVG(k, 50, c)}<div><b>${t}</b><small style="font-size:16px;margin-top:4px">${sub}</small></div>`));
  gsap.set(cs, { opacity: 0 });
  const SP = 128, N = cs.length, span = SP * N;
  const pos = t => { const u = (t - t0) / period; const k = Math.floor(u), f = u - k; return (Math.max(0, k) + (u < 0 ? 0 : easeIO(clamp(f / rollFrac)))) * SP; };
  cs.forEach((c, i) => {
    const Y = t => { let yy = i * SP - pos(t); yy = ((yy % span) + span) % span; if (yy > span / 2) yy -= span; return yy; };
    drive(c, t0, t1, { y: Y, rotationX: t => -Y(t) / 380 * 57.3, opacity: t => clamp(1.2 - Math.abs(Y(t)) / 360) * clamp((t - t0) / .35), filter: t => `blur(${clamp((Math.abs(Y(t)) - 60) / 50, 0, 4).toFixed(2)}px)`, scale: t => 1 + .06 * clamp(1 - Math.abs(Y(t)) / 60) });
  });
  return wheel;
}
/* ---- phrase that parts in the middle to make room (reference: "Meet your new | team members") */
function split(parent, y, size, left, right, t, tOpen, gap, d = .6) {
  const est = str => str.length * size * .52;                       // close-enough width estimate for centring
  const shift = (est(left) - est(right)) / 2;
  const L = el(parent, "div", "abs", `left:0;width:${960 - size * .14}px;top:${y - size * .7}px;text-align:right;font-size:${size}px;font-weight:500;letter-spacing:-0.02em;white-space:nowrap`, left);
  const R = el(parent, "div", "abs", `left:${960 + size * .14}px;top:${y - size * .7}px;font-size:${size}px;font-weight:500;letter-spacing:-0.02em;white-space:nowrap`, right);
  gsap.set([L, R], { x: shift });
  tl.fromTo([L, R], { opacity: 0 }, { opacity: 1, duration: .12, ease: "power1.out", stagger: .1 }, t);
  tl.to(L, { x: -gap, duration: d * .6, ease: "expo.out" }, tOpen); tl.to(R, { x: gap, duration: d * .6, ease: "expo.out" }, tOpen);
  return { L, R };
}
/* ---- footage layer that rides a scene camera -------------------------------------------- */
function vplace(id, x, y, w, h, radius, t0, t1, cam) {
  const v = document.getElementById("vl-" + id) || el(root, "div", "vlayer");   // clip not in this render slice: stand-in
  Object.assign(v.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px", borderRadius: radius + "px" });
  gsap.set(v, { transformOrigin: `${960 - x}px ${540 - y}px` });
  tl.set(v, { opacity: 1 }, t0); tl.set(v, { opacity: 0 }, t1);
  if (cam) cam.followers.push(v);
  return v;
}
function camera(parent) { const c = el(parent, "div", "cam"); c.followers = []; return c; }
function camTo(cam, props, t, d, ease = "sine.inOut") { tl.to([cam, ...cam.followers], { ...props, duration: d, ease }, t); }

/* ============ A  collage opener (0-2.4): blobs + photos re-shuffle around a word card ======= */
{
  const S = clip(0, 2.4);
  const LAY = [
    { word: "Your drone", shapes: [["blob", 760, C.B, 300, 260, -20], ["blob", 640, C.L, 1650, 800, 30], ["sq", 520, C.M, 1600, 180, 12]], photos: [["p_valley", 360, 240, 1480, 380, 8], ["p_house", 300, 200, 300, 800, -6]] },
    { word: "sees", shapes: [["blob", 820, C.Y, 1640, 300, 60], ["blob", 700, C.B, 260, 820, -30], ["circ", 380, C.LB, 420, 160, 0]], photos: [["p_site", 340, 230, 330, 380, -8], ["p_farm", 320, 220, 1560, 780, 6]] },
    { word: "everything.", shapes: [["blob", 760, C.R, 260, 300, 15], ["sq", 600, C.L, 1660, 760, -18], ["blob", 520, C.LB, 1640, 200, 40]], photos: [["p_kiln", 320, 230, 1500, 420, 7], ["p_road", 240, 300, 380, 760, -5], ["p_house", 280, 190, 820, 900, 4]] },
  ];
  LAY.forEach((L, i) => {
    const t0 = i * 0.8, t1 = t0 + 0.8, g = el(S, "div", "full", "opacity:0");
    tl.set(g, { opacity: 1 }, t0); if (i < 2) tl.set(g, { opacity: 0 }, t1);
    const cam = el(g, "div", "cam");
    L.shapes.forEach(([k, s, c, x, y, r]) => { const e = shape(cam, k, s, c, x, y); gsap.set(e, { rotation: r }); });
    L.photos.forEach(([p, w, h, x, y, r], j) => { const e = el(cam, "div", "ph abs", `left:${x - w / 2}px;top:${y - h / 2}px;width:${w}px;height:${h}px`); el(e, "img").src = img(p);
      tl.fromTo(e, { rotation: r, x: 0, y: 0 }, { rotation: r + (j % 2 ? 2 : -2), x: (j % 2 ? 14 : -14), y: -10, duration: .8, ease: "none" }, t0); });
    const card = el(cam, "div", "abs", "left:330px;top:150px;width:1260px;height:780px;background:#F3F2EE;box-shadow:0 30px 80px rgba(0,0,0,.12)");
    el(card, "div", "line", "top:330px;height:120px;width:1260px;font-size:84px;font-weight:500", i === 0 ? `<span class="it">${L.word}</span>` : `<span class="it">${L.word}</span>`);
    gsap.set(card, { rotation: [-2.5, 1.8, -1.2][i] });
    tl.fromTo(cam, { scale: 1.06, rotation: [1, -1, .6][i] }, { scale: 1.0, rotation: 0, duration: .8, ease: "power2.out" }, t0);
  });
}

/* ============ B  inline-photo sentence (2.4-4.6) ========================================== */
{
  const S = clip(2.4, 4.6); const cam = el(S, "div", "cam");
  sentence(cam, 540, 64, ["Even", { img: "p_house", w: 170, h: 116, at: 2.75, rot: -4 }, "next", { img: "p_site", w: 170, h: 116, at: 3.25, rot: 5 }, "door?"], { t: 2.45, stagger: .25 });
  tl.fromTo(cam, { scale: 1 }, { scale: 1.06, duration: 2.2, ease: "none" }, 2.4);
}

/* ============ C/D  "Not anymore." → lockup (4.6-6.7) ======================================== */
{
  const S = clip(4.6, 5.6); words(S, 540, 52, "Not anymore.", 4.62, .22);
  const L = clip(5.6, 6.7); const cam = el(L, "div", "cam");
  const m = el(cam, "div", "abs", "left:770px;top:493px;width:94px;height:94px", mascotSVG(94));
  const t = el(cam, "div", "abs", "left:884px;top:500px;font-size:66px;font-weight:600;letter-spacing:-0.03em;white-space:nowrap", "Site Privacy");
  tl.fromTo(m, { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: .6, ease: "power3.out" }, 5.6);
  tl.fromTo(t, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .5, ease: "power3.out" }, 5.78);
  tl.fromTo(cam, { scale: 1 }, { scale: 1.05, duration: 1.1, ease: "none" }, 5.6);
}

/* ============ E  word split + 3D carousel (6.7-10.3) ======================================= */
{
  const S = clip(6.7, 10.3); const cam = el(S, "div", "cam");

  el(B, "div", "full", "background:linear-gradient(200deg, rgba(40,90,120,.5), rgba(20,30,40,.1) 55%, rgba(220,80,60,.35))");
  const cam = el(B, "div", "cam");
  const panel = el(cam, "div", "glass", "left:560px;top:250px;width:800px;height:120px;overflow:hidden;transform-origin:50% 0;transform:scale(1.2)");
  el(panel, "div", "abs", "left:36px;top:38px;font-size:30px;font-weight:500;white-space:nowrap", "Good to know");
  el(panel, "div", "abs", "left:600px;top:34px;padding:8px 18px;border-radius:12px;background:rgba(255,255,255,.1);font-size:20px", "Show more");
  const NOTES = [["Live view only", "Photos, recordings and downloads are not blurred"], ["Capture unchanged", "What the drone records stays the same"], ["A visual aid, not a guarantee", "Use it alongside your other privacy measures"], ["Safety first", "If the blur can't be applied reliably, you see the clear view"]];
  NOTES.forEach(([a, b], i) => {
    const n = el(panel, "div", "abs", `left:30px;top:${120 + i * 92}px;width:740px;height:76px;border-radius:14px;background:rgba(255,255,255,.06);display:flex;flex-direction:column;justify-content:center;padding:0 22px`,
      `<b style="font-size:24px;font-weight:600">${a}</b><span style="font-size:18px;color:#BDBDC4;margin-top:4px">${b}</span>`);
    tl.fromTo(n, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .35, ease: "power3.out" }, 57.75 + i * .38);
  });
  const m = mascot(cam, 60, 1500, 900);
  tl.fromTo(m, { x: 1560, y: 980 }, { x: 1230, y: 356, duration: .9, ease: "power3.inOut" }, 56.4);
  tap(m, 57.3); ping(cam, 1230, 356, 57.35);
  tl.to(panel, { height: 520, duration: .55, ease: "expo.out" }, 57.4);
  tl.to(m, { x: 1450, y: 760, duration: 1.4, ease: "sine.inOut" }, 57.8);
  tl.fromTo(cam, { scale: 1.12, y: 40 }, { scale: 1, y: -40, duration: 4.4, ease: "sine.inOut" }, 56.2);
}

/* ============ Q  "Privacy [collage] built in" (60.6-63.4) ================================== */
{
  const S = clip(60.6, 63.4); const cam = el(S, "div", "cam");
  split(cam, 540, 54, "Privacy", "built in", 60.62, 61.0, 250, .55);
  const COL = [["p_valley", 300, 200, -70, -70, -6], ["after", 280, 170, 80, -10, 5], ["p_site2", 240, 160, -40, 110, 4], ["p_zones", 220, 150, 90, 120, -5]];
  COL.forEach(([p, w, h, x, y, r], i) => {
    const e = el(cam, "div", "ph abs", `left:${960 - w / 2}px;top:${540 - h / 2}px;width:${w}px;height:${h}px`); el(e, "img").src = img(p);
    tl.fromTo(e, { x: x * .2, y: y * .2 + 80, scale: .4, rotation: 0, opacity: 0 }, { x, y, scale: 1, rotation: r, opacity: 1, duration: .32, ease: "power4.out" }, 61.25 + i * .14);
  });
  tl.fromTo(cam, { scale: 1 }, { scale: 1.08, duration: 2.8, ease: "none" }, 60.6);
}

/* ============ R  words on shape tokens (63.4-67.0): an overlapping row that rolls left ========= */
{
  const S = clip(63.4, 67.0);
  const TOK = [["It only", "circ", C.L, C.B], ["shows", "oct", C.R, C.P], ["what's", "hex", C.Y, C.G], ["yours.", "circ", C.W, C.B]];
  const g = el(S, "div", "abs", "left:960px;top:540px;width:0;height:0;transform:scale(1.55)");
  const T = k => 63.5 + k * .8;                                       // token k takes centre stage at T(k)
  TOK.forEach(([w, k, c, ring], i) => {
    const tok = el(g, "div", "abs", "left:-110px;top:-110px;width:220px;height:220px");
    el(tok, "div", "abs", "left:-24px;top:-24px", shapeSVG(k, 268, ring));
    el(tok, "div", "abs", "left:0;top:0", shapeSVG(k === "oct" ? "circ" : k, 220, c));
    el(tok, "div", "abs", `left:0;top:0;width:220px;height:220px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:600;color:${c === C.R ? "#fff" : "#1D1D1F"};white-space:nowrap`, w);
    gsap.set(tok, { x: 420, scale: .5, opacity: 0, zIndex: 1 });
    const enter = Math.max(63.4, T(i) - .8);
    tl.to(tok, { x: 200, scale: .66, opacity: 1, duration: .5, ease: "power3.out" }, enter);
    tl.set(tok, { zIndex: 3 }, T(i));
    tl.to(tok, { x: 0, scale: 1, duration: .55, ease: "power3.inOut" }, T(i));
    if (i < TOK.length - 1) {
      tl.set(tok, { zIndex: 2 }, T(i + 1) + .2);
      tl.to(tok, { x: -200, scale: .66, duration: .55, ease: "power3.inOut" }, T(i + 1));
      tl.to(tok, { x: -420, scale: .5, opacity: 0, duration: .5, ease: "power3.in" }, T(i + 2) < 67 ? T(i + 2) : 66.4);
    }
    const dir = i % 2 ? 1 : -1;                                       // every token keeps turning gently
    tl.fromTo(tok, { rotation: -14 * dir }, { rotation: 14 * dir, duration: 3.6, ease: "sine.inOut" }, 63.4);
  });
}

/* ============ S  lockup (67.0-70.0) ======================================================== */
{
  const S = clip(67.0, 70.0); const cam = el(S, "div", "cam");
  const g = el(cam, "div", "abs", "left:960px;top:540px;width:0;height:0");
  [["hex", 260, C.B], ["circ", 220, C.L], ["sq", 200, C.R]].forEach(([k, s, c], i) => {
    const e = shape(g, k, s, c, 0, 0);
    tl.fromTo(e, { scale: 1, rotation: i * 30, opacity: 1 }, { scale: .1, rotation: 200 + i * 40, opacity: .8, duration: .55, ease: "power3.in" }, 67.0 + i * .04);
    tl.set(e, { opacity: 0 }, 67.62);
  });
  const lock = el(cam, "div", "abs", "left:0;width:1920px;top:493px;display:flex;justify-content:center;align-items:center;gap:22px");
  const mk = el(lock, "div", "", "width:94px;height:94px", mascotSVG(94));
  const tx = el(lock, "div", "", "font-size:66px;font-weight:600;letter-spacing:-0.03em;white-space:nowrap", "Site Privacy");
  tl.fromTo(mk, { scale: 0, rotation: -140 }, { scale: 1, rotation: 0, duration: .65, ease: "power3.out" }, 67.5);
  tl.fromTo(tx, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .5, ease: "power3.out" }, 67.75);
  const by = el(cam, "div", "abs", "left:0;width:1920px;top:620px;text-align:center;font-size:24px;color:#8C8C90;font-weight:500", "in FlytBase Cockpit");
  tl.fromTo(by, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .45, ease: "power3.out" }, 68.2);
  tl.fromTo(cam, { scale: 1 }, { scale: 1.04, duration: 3, ease: "none" }, 67.0);
}

tl.set({}, {}, 70);
if (OFF || DUR !== 70) {                                             // slice render: play [OFF, OFF+DUR] of the film
  const outer = gsap.timeline({ paused: true });
  outer.add(tl.tweenFromTo(OFF, OFF + DUR, { ease: "none" }), 0);
  window.__timelines["main"] = outer;
} else window.__timelines["main"] = tl;
</script>

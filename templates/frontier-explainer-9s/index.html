<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[
  {"id":"label","type":"string","label":"Pink label","default":"RLHF"},
  {"id":"line1","type":"string","label":"Caption 1","default":"The post ¶ training algorithm"},
  {"id":"line2","type":"string","label":"Caption 2","default":"behind most frontier AI"},
  {"id":"node_top","type":"string","label":"Diagram label","default":"INSTRUCTION"},
  {"id":"node_left","type":"string","label":"Left node","default":"Human"},
  {"id":"node_right","type":"string","label":"Right node","default":"Response"},
  {"id":"line3","type":"string","label":"Caption 3","default":"Instruction Following"},
  {"id":"chat_title","type":"string","label":"Chat title","default":"ChatGPT"},
  {"id":"chat_user","type":"string","label":"User message","default":"Summarize this document in three bullet points."},
  {"id":"chat_reply","type":"string","label":"Assistant reply","default":"Sure. Here are Three key points of the document:"},
  {"id":"line4","type":"string","label":"Caption 4","default":"Chat"},
  {"id":"accent","type":"color","label":"Accent","default":"#ec79a2"},
  {"id":"footage","type":"string","label":"Footage slot (optional)","default":""}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Frontier explainer</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Sans"; src: url(assets/fonts/Inter.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Mono"; src: url(assets/fonts/JetBrainsMono.woff2) format("woff2"); font-weight: 400; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Sans", sans-serif; color: #141414; }
.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
#grid { background-image: linear-gradient(90deg, #f0f0f0 1px, transparent 1px), linear-gradient(#f0f0f0 1px, transparent 1px);
  background-size: 177px 177px; background-position: -1px 43px; }
#shot { position: absolute; inset: 0; object-fit: cover; opacity: 0; }        /* media slot */

/* ---- pink label + connector ---- */
.chip { position: absolute; display: flex; align-items: center; justify-content: center;
  background: var(--accent); color: #141414; font-size: 84px; font-weight: 450; letter-spacing: -0.01em; }
.tick { position: absolute; width: 22px; height: 22px; border-color: #141414; }
.wire { position: absolute; height: 3px; background: #141414; }
.icon { position: absolute; width: 96px; height: 96px; transform-origin: 50% 50%; }

/* ---- captions ---- */
.cap { position: absolute; left: 0; width: 1920px; display: flex; justify-content: center; align-items: baseline;
  font-size: 104px; letter-spacing: -0.02em; white-space: nowrap; }
.cap .w { display: inline-block; margin: 0 .16em; }
.mark { position: absolute; width: 26px; height: 26px; border: 3px solid #141414; }

/* ---- node diagram ---- */
.mono { position: absolute; font-family: "Mono", monospace; font-size: 30px; letter-spacing: .18em; white-space: pre; }
.node { position: absolute; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 14px;
  background: #f1f1f1; border-radius: 9px; font-size: 26px; }
.pill { position: absolute; display: flex; align-items: center; height: 56px; padding: 0 26px; border-radius: 11px;
  background: #101010; color: #fff; font-size: 30px; }
.sq { position: absolute; width: 56px; height: 56px; border-radius: 12px; background: #f1f1f1;
  display: flex; align-items: center; justify-content: center; }
.orbit { position: absolute; width: 230px; height: 230px; }

/* ---- chat card ---- */
#chat { position: absolute; left: 314px; top: 120px; width: 1261px; height: 780px; background: #fff;
  box-shadow: 0 30px 80px rgba(0,0,0,.10); overflow: hidden; }
#chat .bar { height: 49px; background: #1e1e1e; color: #fff; font-size: 26px; display: flex; align-items: center; padding: 0 22px; gap: 10px; }
.bubble { position: absolute; max-width: 560px; padding: 22px 26px; border-radius: 22px; font-size: 34px; line-height: 1.28; }
.bubble.user { right: 42px; top: 92px; background: #eef2fd; }
.bubble.bot { left: 42px; top: 300px; background: #f2f2f2; }
.acts { position: absolute; left: 60px; top: 452px; display: flex; gap: 22px; opacity: .45; font-size: 26px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9.208" data-width="1920" data-height="1080"></div>
<script>
/* ===========================================================================================
   Replica of 0:08–0:17 of the TypeSafe/“frontier AI” film (24 fps).
   Beats are source frame numbers / 24. Icons are generic stand-ins, not brand logos.
   =========================================================================================== */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");
const V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
const P = {
  label: V.label || "RLHF", line1: V.line1 || "The post ¶ training algorithm", line2: V.line2 || "behind most frontier AI",
  node_top: V.node_top || "INSTRUCTION", node_left: V.node_left || "Human", node_right: V.node_right || "Response",
  line3: V.line3 || "Instruction Following", chat_title: V.chat_title || "ChatGPT",
  chat_user: V.chat_user || "Summarize this document in three bullet points.",
  chat_reply: V.chat_reply || "Sure. Here are Three key points of the document:",
  line4: V.line4 || "Chat", accent: V.accent || "#ec79a2", footage: V.footage || "",
};
const F = 1 / 24, DUR = 9.208;
root.style.setProperty("--accent", P.accent);
let uid = 0, track = 1;
const el = (parent, tag, cls, style, html) => {
  const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.setAttribute("style", style);
  if (html != null) e.innerHTML = html; e.id = e.id || "e" + uid++; parent.appendChild(e); return e;
};
function clip(t0, t1, cls, style) {
  const d = el(root, "div", "clip " + (cls || ""), style);
  d.dataset.start = t0.toFixed(3); d.dataset.duration = Math.max(0.04, t1 - t0).toFixed(3);
  d.dataset.trackIndex = String(track++); return d;
}

/* ---------- background: grid, optional footage ---------- */
const bg = clip(0, DUR, "full", "background:#fff");
el(bg, "div", "full", "", "").id = "gridlayer";
document.getElementById("gridlayer").id = "grid";
if (P.footage) {
  const v = el(bg, "video", "", "position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;opacity:.18");
  v.src = P.footage; v.muted = true; v.playsInline = true; v.className = "clip";
  v.dataset.start = "0"; v.dataset.duration = DUR.toFixed(3); v.dataset.trackIndex = String(track++);
}

/* ---------- ICONS (generic stand-ins) ---------- */
const ICON = {
  knot: `<svg viewBox="0 0 100 100" fill="none" stroke="#141414" stroke-width="6">${[0, 60, 120].map(a => `<ellipse cx="50" cy="50" rx="34" ry="15" transform="rotate(${a} 50 50)"/>`).join("")}</svg>`,
  burst: `<svg viewBox="0 0 100 100"><g stroke="#d9705c" stroke-width="6" stroke-linecap="round">${[0, 30, 60, 90, 120, 150].map(a => `<line x1="50" y1="10" x2="50" y2="90" transform="rotate(${a} 50 50)"/>`).join("")}</g></svg>`,
  spark: `<svg viewBox="0 0 100 100"><defs><linearGradient id="gs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c14b"/><stop offset=".4" stop-color="#e0564f"/><stop offset=".7" stop-color="#3f7cf6"/><stop offset="1" stop-color="#37c98b"/></linearGradient></defs>
    <path d="M50 6c4 26 18 40 44 44-26 4-40 18-44 44-4-26-18-40-44-44 26-4 40-18 44-44z" fill="url(#gs)"/></svg>`,
  slash: `<svg viewBox="0 0 100 100" fill="none" stroke="#141414" stroke-width="6"><circle cx="50" cy="50" r="30"/><line x1="26" y1="74" x2="74" y2="26"/></svg>`,
};

/* ---------- PHASE 1: pink label + wire + icons + captions, all panning left ---------- */
const PAN = 13.7;                                   // px per frame, measured off the source
{
  const g = clip(0, 100 * F, "full");
  const pan = el(g, "div", "", "position:absolute;left:0;top:0;width:1920px;height:1080px");
  window.__pan = pan;
  // elbow wire coming in from the left, into the chip, and out to the icons
  el(pan, "div", "wire", "left:-260px;top:470px;width:430px");
  el(pan, "div", "wire", "left:166px;top:380px;width:3px;height:92px");
  const chip = el(pan, "div", "chip", "left:528px;top:386px;width:372px;height:185px", P.label);
  el(chip, "div", "tick", "right:8px;top:8px;border-top:3px solid;border-right:3px solid");
  el(chip, "div", "tick", "left:8px;bottom:8px;border-bottom:3px solid;border-left:3px solid");
  el(pan, "div", "wire", "left:900px;top:470px;width:210px");
  const icons = ["knot", "burst", "spark", "slash"];
  icons.forEach((k, i) => {
    const ic = el(pan, "div", "icon", `left:${1130 + i * 132}px;top:${424}px`, ICON[k]);
    tl.fromTo(ic, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 5 * F, ease: "back.out(2)" }, (17 + i * 7) * F);
  });
  tl.fromTo(pan, { x: 0 }, { x: -PAN * 72, duration: 72 * F, ease: "none" }, F);          // steady drift left
  tl.to(pan, { x: -2600, duration: 23 * F, ease: "power2.in" }, 73 * F);                  // exit left
}

/* ---------- captions: words land one at a time ---------- */
function caption(words, t0, times, cy, opts = {}) {
  const host = opts.into || clip(t0, opts.end || DUR, "full");
  const g = opts.into ? el(host, "div", "", "position:absolute;left:0;top:0;width:1920px;height:1080px") : host;
  const row = el(g, "div", "cap", `top:${cy}px;height:150px;font-size:${opts.size || 104}px;` +
    (opts.left != null ? `justify-content:flex-start;padding-left:${opts.left}px` : ""));
  const spans = words.map(w => el(row, "span", "w", "opacity:0", w));
  spans.forEach((s, i) => tl.fromTo(s, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 4 * F, ease: "power2.out" }, times[i] * F));
  el(g, "div", "mark", `left:430px;top:${cy + 118}px;border-top:0;border-right:0`);
  el(g, "div", "mark", `left:1470px;top:${cy - 6}px;border-bottom:0;border-left:0`);
  if (opts.exit) tl.to(g.querySelectorAll(".cap, .mark"), { x: -2200, duration: 22 * F, ease: "power2.in" }, opts.exit * F);
  if (opts.until) tl.set(g, { opacity: 0 }, opts.until * F);
  return g;
}
caption(P.line1.split(" "), 0, [1, 3, 5, 9], 588, { into: window.__pan, left: 1056, until: 24 });
caption(P.line2.split(" "), 25 * F, [23, 33, 39, 45], 588, { into: window.__pan, left: 1056 });

/* ---------- PHASE 3: node diagram ---------- */
{
  const g = clip(84 * F, 192 * F, "full");
  const grp = el(g, "div", "", "position:absolute;left:0;top:0;width:1920px;height:1080px");
  // INSTRUCTION types on, newest letters in the accent colour
  const top = el(grp, "div", "mono", "left:560px;top:258px");
  const letters = [...P.node_top].map(ch => el(top, "span", "", "opacity:0", ch));
  letters.forEach((s, i) => {
    tl.set(s, { opacity: 1, color: P.accent }, (88 + i * 1.4) * F);
    tl.set(s, { color: "#141414" }, (92 + i * 1.4) * F);
  });
  const chev = el(grp, "div", "", "position:absolute;left:640px;top:400px;width:60px;height:70px",
    `<svg viewBox="0 0 60 70" fill="none" stroke="#141414" stroke-width="7"><path d="M8 14l22 18 22-18"/><path d="M8 40l22 18 22-18"/></svg>`);
  tl.fromTo(chev, { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 6 * F, ease: "power2.out" }, 97 * F);
  tl.to(chev, { y: 10, duration: 24 * F, ease: "sine.inOut", yoyo: true, repeat: 3 }, 104 * F);

  const human = el(grp, "div", "node", "left:523px;top:449px",
    `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span>${P.node_left}</span>`);
  tl.fromTo(human, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 5 * F, ease: "power2.out" }, 92 * F);
  const sq = el(grp, "div", "sq", "left:700px;top:449px",
    `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>`);
  tl.fromTo(sq, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 5 * F, ease: "back.out(2)" }, 101 * F);

  // orbiting particles around a solid dot
  const orb = el(grp, "div", "orbit", "left:790px;top:362px");
  orb.innerHTML = `<svg viewBox="0 0 230 230" fill="none" stroke="#141414" stroke-opacity=".12">
      <ellipse cx="115" cy="115" rx="70" ry="30"/><ellipse cx="115" cy="115" rx="70" ry="30" transform="rotate(60 115 115)"/>
      <ellipse cx="115" cy="115" rx="70" ry="30" transform="rotate(120 115 115)"/></svg>
    <div style="position:absolute;left:100px;top:100px;width:30px;height:30px;border-radius:50%;background:#141414"></div>`;
  tl.fromTo(orb, { opacity: 0 }, { opacity: 1, duration: 5 * F }, 106 * F);
  tl.fromTo(orb.querySelector("svg"), { rotation: 0 }, { rotation: 360, duration: 80 * F, ease: "none", transformOrigin: "50% 50%" }, 106 * F);
  const rnd = (s => () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296))(9);
  for (let i = 0; i < 7; i++) {
    const a = rnd() * 360, r = 74 + rnd() * 26;
    const dot = el(orb, "div", "", `position:absolute;left:${115 + Math.cos(a) * r - 3}px;top:${115 + Math.sin(a) * r * .45 - 3}px;width:6px;height:6px;border-radius:50%;background:#141414`);
    tl.fromTo(dot, { opacity: 0 }, { opacity: .8, duration: 3 * F }, (108 + i * 2) * F);
    tl.to(dot, { opacity: .2, duration: 14 * F, yoyo: true, repeat: 4, ease: "sine.inOut" }, (112 + i * 3) * F);
  }
  const resp = el(grp, "div", "pill", "left:1112px;top:449px", P.node_right);
  tl.fromTo(resp, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 6 * F, ease: "power2.out" }, 121 * F);
  tl.fromTo(grp, { x: 60 }, { x: 0, duration: 30 * F, ease: "power2.out" }, 84 * F);
  tl.to(grp, { x: -2300, duration: 16 * F, ease: "power2.in" }, 182 * F);
}
caption(P.line3.split(" "), 152 * F, [155, 163], 586, { end: 192 * F, size: 92, exit: 182 });

/* ---------- PHASE 4: chat card ---------- */
{
  const g = clip(190 * F, DUR, "full");
  const chat = el(g, "div", "", "position:absolute;left:314px;top:104px;width:1261px;height:660px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.10);overflow:hidden");
  el(chat, "div", "bar", "height:66px;background:#1e1e1e;color:#fff;font-size:26px;display:flex;align-items:center;padding:0 22px;gap:10px",
    `${P.chat_title} <span style="opacity:.7;font-size:20px">▾</span>`);
  const user = el(chat, "div", "bubble user", "position:absolute;right:65px;top:131px;max-width:560px;padding:22px 26px;border-radius:22px;background:#eef2fd;font-size:34px;line-height:1.28", P.chat_user);
  const bot = el(chat, "div", "bubble bot", "position:absolute;left:71px;top:356px;max-width:520px;padding:22px 26px;border-radius:22px;background:#f2f2f2;font-size:34px;line-height:1.28", P.chat_reply);
  const acts = el(chat, "div", "acts", "position:absolute;left:78px;top:512px;display:flex;gap:22px;opacity:.45;font-size:26px", "⧉ ↥ ⟳ ⤢");
  tl.fromTo(chat, { x: -420, opacity: 0 }, { x: 0, opacity: 1, duration: 8 * F, ease: "power3.out" }, 191 * F);
  tl.fromTo(user, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 5 * F, ease: "power2.out" }, 194 * F);
  tl.fromTo(bot, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 5 * F, ease: "power2.out" }, 204 * F);
  tl.fromTo(acts, { opacity: 0 }, { opacity: .45, duration: 4 * F }, 207 * F);
}
{
  const g = clip(199 * F, DUR, "full");
  const row = el(g, "div", "cap", "top:780px;height:150px;font-size:104px");
  const w = el(row, "span", "w", "opacity:0", P.line4);
  const ic = el(row, "span", "w", "opacity:0;font-size:74px",
    `<svg width="86" height="70" viewBox="0 0 86 70"><path d="M6 14h56l18 18v24H24L6 38z" fill="none" stroke="#141414" stroke-width="5" stroke-linejoin="round"/><path d="M70 6l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#141414"/></svg>`);
  tl.fromTo(w, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 4 * F, ease: "power2.out" }, 199 * F);
  tl.fromTo(ic, { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: 5 * F, ease: "back.out(2)" }, 209 * F);
  el(g, "div", "mark", "left:700px;top:898px;border-top:0;border-right:0");
}

tl.set({}, {}, DUR);
window.__timelines["main"] = tl;
</script>
</body>
</html>

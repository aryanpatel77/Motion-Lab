<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Motion Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%23F97316'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M7 23l6-13 5 9 7-12' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #09090B; --side: #0D0D10; --s1: #131317; --s2: #19191E; --s3: #212128;
  --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.13);
  --ink: #EDEDF0; --mute: #A1A1AA; --dim: #6E6E78;
  --acc: #8B5CF6; --acc2: #F97316; --ok: #34D399; --err: #F87171; --warn: #FBBF24;
  --grad: linear-gradient(135deg, #8B5CF6 0%, #D946EF 55%, #F97316 100%);
  --r: 14px; --sb: 236px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, select, textarea { font: inherit; color: var(--ink); }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
::selection { background: rgba(139,92,246,.35); }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #26262e; border-radius: 10px; border: 2px solid var(--bg); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--sb) 1fr; min-height: 100vh; }
aside { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; box-shadow: 0 6px 20px rgba(139,92,246,.35); }
.brand b { font-size: 15.5px; letter-spacing: -.01em; } .brand span { display: block; font-size: 11.5px; color: var(--dim); margin-top: -2px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; color: var(--mute); font-weight: 500; transition: background .15s, color .15s; margin-bottom: 2px; }
.nav a:hover { background: var(--s1); color: var(--ink); }
.nav a.on { background: var(--s2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .9; }
.nav .count { margin-left: auto; font-size: 11.5px; color: var(--dim); }
.nav .sep { height: 1px; background: var(--line); margin: 12px 8px; }
.side-foot { margin-top: auto; padding: 12px; border-radius: 12px; background: var(--s1); border: 1px solid var(--line); font-size: 12px; color: var(--mute); }
.side-foot .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(52,211,153,.15); margin-right: 7px; }
main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 14px 32px; background: rgba(9,9,11,.78); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.crumbs { display: flex; align-items: center; gap: 8px; color: var(--mute); font-weight: 500; }
.crumbs b { color: var(--ink); font-weight: 600; }
.crumbs a:hover { color: var(--ink); }
.search { margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; height: 36px; width: 300px; }
.search input { flex: 1; background: none; border: 0; outline: 0; }
.kbd { font-size: 11px; color: var(--dim); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 6px; }
.page { padding: 28px 32px 80px; max-width: 1560px; animation: fade .25s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
h1 { font-size: 26px; letter-spacing: -.025em; margin: 0 0 6px; } h2 { font-size: 17px; letter-spacing: -.01em; margin: 0; }
.sub { color: var(--mute); margin: 0; }
.sec { margin-top: 36px; } .sec-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.sec-h a.more { margin-left: auto; color: var(--mute); font-size: 13px; } .sec-h a.more:hover { color: var(--ink); }

/* ---------- buttons, chips, inputs ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 15px; border-radius: 10px; font-weight: 550; transition: transform .12s, background .15s, opacity .15s; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--grad); color: #fff; box-shadow: 0 6px 22px rgba(139,92,246,.28); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--s2); border: 1px solid var(--line); } .btn.ghost:hover { background: var(--s3); }
.btn.sm { height: 31px; padding: 0 11px; font-size: 13px; border-radius: 9px; }
.btn:disabled { opacity: .45; cursor: default; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 32px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--s1); color: var(--mute); font-weight: 500; font-size: 13px; }
.chip:hover { color: var(--ink); } .chip.on { background: var(--ink); color: #0b0b0d; border-color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 550; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line2); color: var(--mute); }
.pill.ok { color: var(--ok); border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.08); }
.pill.old { color: var(--dim); }
.field { display: block; margin-bottom: 14px; } .field span { display: block; font-size: 12px; color: var(--mute); margin-bottom: 6px; font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; outline: 0; transition: border-color .15s, box-shadow .15s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(139,92,246,.2); }
.seg { display: grid; grid-auto-flow: column; background: var(--bg); border: 1px solid var(--line2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { height: 32px; border-radius: 8px; color: var(--mute); font-weight: 500; font-size: 13px; }
.seg button.on { background: var(--s3); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line2); }

/* ---------- media cards ---------- */
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.grid.sm { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: transform .2s var(--ease), border-color .2s, box-shadow .2s; cursor: pointer; position: relative; }
.card:hover { transform: translateY(-3px); border-color: var(--line2); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.media { position: relative; aspect-ratio: 16/9; background: #050506; overflow: hidden; }
.media img, .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.media video { opacity: 0; transition: opacity .25s; } .card:hover .media video.ready { opacity: 1; }
.media .dur { position: absolute; right: 9px; bottom: 9px; font-size: 11.5px; font-weight: 600; background: rgba(0,0,0,.66); backdrop-filter: blur(6px); padding: 2px 7px; border-radius: 6px; }
.media .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .2s; }
.card:hover .media .play { opacity: 1; }
.media .play i { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.14); backdrop-filter: blur(10px); display: grid; place-items: center; border: 1px solid rgba(255,255,255,.25); }
.media .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 13px; background: repeating-linear-gradient(45deg, #0d0d10 0 12px, #101014 12px 24px); }
.card .info { padding: 13px 15px 15px; }
.card .t { font-weight: 600; letter-spacing: -.01em; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .m { color: var(--dim); font-size: 12.5px; margin-top: 5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card .sel { position: absolute; top: 10px; left: 10px; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid rgba(255,255,255,.55); background: rgba(0,0,0,.35); backdrop-filter: blur(6px); z-index: 3; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
.card:hover .sel, .card .sel.on { opacity: 1; } .card .sel.on { background: var(--acc); border-color: var(--acc); }
.palette { display: flex; gap: 4px; } .palette i { width: 14px; height: 14px; border-radius: 4px; display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.empty { border: 1px dashed var(--line2); border-radius: var(--r); padding: 44px; text-align: center; color: var(--mute); }

/* ---------- hero / paste bar ---------- */
.hero { position: relative; border-radius: 22px; padding: 44px 44px 40px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(120% 140% at 0% 0%, rgba(139,92,246,.22), transparent 55%), radial-gradient(90% 120% at 100% 100%, rgba(249,115,22,.16), transparent 55%), var(--s1); }
.hero h1 { font-size: 34px; } .hero p { color: var(--mute); max-width: 640px; margin: 8px 0 22px; font-size: 15px; }
.paste { display: flex; gap: 10px; align-items: center; background: rgba(9,9,11,.75); border: 1px solid var(--line2); border-radius: 14px; padding: 7px 7px 7px 16px; max-width: 820px; transition: border-color .2s, box-shadow .2s; }
.paste:focus-within { border-color: var(--acc); box-shadow: 0 0 0 4px rgba(139,92,246,.18); }
.paste input { flex: 1; background: none; border: 0; outline: 0; font-size: 15px; height: 40px; }
.paste .or { color: var(--dim); font-size: 12.5px; white-space: nowrap; }
.hint { color: var(--dim); font-size: 12.5px; margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
.hint b { color: var(--mute); font-weight: 500; }

/* ---------- progress / stepper ---------- */
.stepper { display: flex; gap: 6px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 99px; background: var(--s2); color: var(--dim); font-size: 13px; font-weight: 500; border: 1px solid var(--line); }
.step.now { color: var(--ink); border-color: rgba(139,92,246,.5); background: rgba(139,92,246,.12); }
.step.done { color: var(--ok); }
.spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(255,255,255,.18); border-top-color: var(--acc); animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.errbox { margin-top: 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(248,113,113,.35); background: rgba(248,113,113,.08); color: #fecaca; font-size: 13.5px; }
.bar { height: 4px; border-radius: 4px; background: var(--s3); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--grad); width: 30%; animation: indet 1.4s var(--ease) infinite; }
@keyframes indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }

/* ---------- detail layouts ---------- */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 26px; align-items: start; }
@media (max-width: 1180px) { .detail { grid-template-columns: 1fr; } }
.player { border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--line); position: relative; }
.player video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; }
.panel { background: var(--s1); border: 1px solid var(--line); border-radius: 16px; padding: 20px; position: sticky; top: 84px; }
.panel h3 { margin: 0 0 4px; font-size: 15px; } .panel .sub { font-size: 13px; margin-bottom: 16px; }
.versions { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; margin-top: 14px; }
.ver { flex: none; width: 168px; border-radius: 11px; overflow: hidden; border: 1px solid var(--line); background: var(--s1); cursor: pointer; transition: border-color .15s, transform .15s; }
.ver:hover { transform: translateY(-2px); } .ver.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
.ver img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
.ver div { padding: 7px 9px; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; font-size: 13px; } .kv dt { color: var(--dim); } .kv dd { margin: 0; text-align: right; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; } .tag { font-size: 12px; color: var(--mute); background: var(--s2); border: 1px solid var(--line); padding: 3px 9px; border-radius: 7px; }
details { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 16px; } summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; } summary::-webkit-details-marker { display: none; }
summary::after { content: "›"; margin-left: auto; color: var(--dim); transition: transform .2s; font-size: 18px; } details[open] summary::after { transform: rotate(90deg); }
pre.log { background: #050506; border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-height: 220px; overflow: auto; font: 12px/1.6 "JetBrains Mono", monospace; color: #a8a8b3; white-space: pre-wrap; margin: 10px 0 0; }

/* timeline of sections under a reference player */
.tline { display: flex; gap: 3px; margin-top: 12px; height: 34px; }
.tline button { position: relative; border-radius: 7px; background: var(--s2); border: 1px solid var(--line); overflow: hidden; min-width: 6px; transition: background .15s, border-color .15s; }
.tline button:hover { background: var(--s3); } .tline button.on { border-color: var(--acc); background: rgba(139,92,246,.18); }
.tline button span { position: absolute; left: 7px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--mute); white-space: nowrap; }
.tline button i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(139,92,246,.35); width: 0; }
.secs { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
.seccard { background: var(--s1); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; transition: border-color .15s; }
.seccard.on { border-color: var(--acc); }
.seccard img { width: 100%; display: block; background: #000; cursor: zoom-in; }
.seccard .h { display: flex; align-items: center; gap: 10px; padding: 10px 13px; font-size: 13px; }
.seccard .h b { font-weight: 600; } .seccard .h span { color: var(--dim); }
.seccard .h button { margin-left: auto; color: var(--mute); font-size: 12.5px; } .seccard .h button:hover { color: var(--ink); }

/* compare */
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cmp .lbl { font-size: 12px; color: var(--mute); margin-bottom: 8px; font-weight: 500; }
.ctrl { display: flex; align-items: center; gap: 12px; margin-top: 16px; background: var(--s1); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.ctrl input[type=range] { flex: 1; accent-color: var(--acc); }

/* floating: compare bar, jobs tray, toasts, lightbox, drop overlay */
.floatbar { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 160%); opacity: 0; visibility: hidden; transition: transform .3s var(--ease), opacity .2s, visibility .3s; z-index: 40; background: var(--s2); border: 1px solid var(--line2); border-radius: 16px; padding: 10px 10px 10px 18px; display: flex; gap: 14px; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.floatbar.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
.tray { position: fixed; right: 20px; bottom: 20px; z-index: 45; display: flex; flex-direction: column; gap: 10px; width: 330px; }
.job { background: var(--s2); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; box-shadow: 0 14px 40px rgba(0,0,0,.5); animation: fade .25s var(--ease); }
.job .r { display: flex; align-items: center; gap: 10px; font-size: 13px; } .job .r b { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .s { color: var(--mute); font-size: 12px; margin: 6px 0 8px; }
.toast { background: var(--s2); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 14px 40px rgba(0,0,0,.5); animation: fade .25s var(--ease); font-size: 13.5px; }
.toast .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; } .toast.bad .dot { background: var(--err); }
.toast a { margin-left: auto; color: #c4b5fd; font-weight: 600; white-space: nowrap; }
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.82); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 30px; }
.modal.on { display: flex; animation: fade .2s var(--ease); }
.modal .box { width: min(1280px, 100%); }
.modal .bar2 { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; } .modal .bar2 b { flex: 1; }
.modal img.full { max-width: 100%; max-height: 86vh; display: block; margin: 0 auto; border-radius: 10px; }
.drop { position: fixed; inset: 0; z-index: 70; background: rgba(139,92,246,.14); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; }
.drop.on { display: flex; } .drop div { border: 2px dashed rgba(196,181,253,.8); border-radius: 22px; padding: 60px 90px; font-size: 20px; font-weight: 600; background: rgba(9,9,11,.7); }

/* assistant chat */
.ask { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
.ask h3 { display: flex; align-items: center; gap: 8px; }
.ask .spark { width: 22px; height: 22px; border-radius: 7px; background: var(--grad); display: grid; place-items: center; }
.thread { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; margin: 12px 0; padding-right: 4px; }
.msg { padding: 10px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: rgba(139,92,246,.18); border: 1px solid rgba(139,92,246,.35); max-width: 90%; }
.msg.bot { background: var(--s2); border: 1px solid var(--line); }
.msg.bad { border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.08); }
.acts { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--mute); padding: 4px 2px; }
.acts div { display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acts div::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex: none; }
.acts div:last-child::before { background: var(--acc); box-shadow: 0 0 0 3px rgba(139,92,246,.25); }
.composer { position: relative; }
.composer textarea { width: 100%; min-height: 84px; resize: vertical; background: var(--bg); border: 1px solid var(--line2); border-radius: 12px; padding: 11px 12px 44px; outline: 0; font-size: 13.5px; }
.composer textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(139,92,246,.2); }
.composer .send { position: absolute; right: 8px; bottom: 10px; }
.sugg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.sugg button { font-size: 12px; color: var(--mute); background: var(--s2); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; }
.sugg button:hover { color: var(--ink); border-color: var(--line2); }
.signin { font-size: 12.5px; padding: 10px 12px; border-radius: 10px; background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.35); color: #fde68a; margin-bottom: 10px; }
.signin code { background: rgba(0,0,0,.35); padding: 1px 6px; border-radius: 5px; }
.aebox { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 16px 0 4px; background: linear-gradient(180deg, rgba(153,153,255,.07), transparent); }
.aebox .h { display: flex; align-items: center; gap: 10px; font-weight: 600; } .aebox .h i { width: 26px; height: 26px; border-radius: 7px; background: #1f1b4b; color: #9999ff; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; border: 1px solid #3b3591; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 18 L10 7 L14 14 L19 5"/></svg></div>
      <div><b>Motion Lab</b><span>make · study · ship</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span class="live"></span>Running on this Mac<div class="mono" style="margin-top:4px;color:var(--dim)">localhost:8770</div></div>
  </aside>
  <main>
    <div class="top"><div class="crumbs" id="crumbs"></div>
      <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E6E78" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="Search everything" /><span class="kbd">/</span></label>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="floatbar" id="cmpbar"><span id="cmptext">Pick two videos to compare</span><button class="btn sm ghost" onclick="SEL.clear();renderView()">Clear</button><button class="btn sm primary" id="cmpgo">Compare</button></div>
<div class="tray" id="tray"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="drop" id="drop"><div>Drop a video to analyse it</div></div>

<script>
/* ================================ state + helpers ================================ */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let D = null;                                       // /api/data
const SEL = new Set();                              // renders picked for compare
const WATCH = new Map();                            // job id -> {kind, label}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dur = s => { if (!s && s !== 0) return ""; s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const mb = b => b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
const ago = t => { const s = Date.now() / 1000 - t; return s < 90 ? "just now" : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  tpl: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  ref: '<path d="M4 5h16v14H4z"/><path d="M4 9h16M9 5v4M15 5v4"/>',
  ren: '<path d="M5 3l14 9-14 9z"/>',
  ae: '<path d="M4 20 9 4h2l5 16M6 14h8M17 9v11"/>',
  dl: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  cmp: '<rect x="3" y="5" width="8" height="14" rx="2"/><rect x="13" y="5" width="8" height="14" rx="2"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>',
};
const ico = (k, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
const PLAY = `<i><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"/></svg></i>`;
const tplById = id => D.templates.find(t => t.id === id);
const projTitle = p => tplById(p)?.title?.split(":")[0].split("(")[0].trim() || p.replace(/[-_]+/g, " ");

/* media block with hover-to-play (video only loads on first hover) */
function media({ poster, video, d, none = "no preview yet" }) {
  return `<div class="media">${poster ? `<img src="${poster}" loading="lazy" alt="">` : `<div class="none">${none}</div>`}
    ${video ? `<video muted loop playsinline preload="none" data-src="${video}"></video><div class="play">${PLAY}</div>` : ""}
    ${d ? `<span class="dur">${dur(d)}</span>` : ""}</div>`;
}
function wireHover(root = document) {
  root.querySelectorAll(".card").forEach(c => {
    const v = c.querySelector("video[data-src]"); if (!v) return;
    c.onmouseenter = () => { if (!v.src) { v.src = v.dataset.src; v.oncanplay = () => v.classList.add("ready"); } v.play().catch(() => {}); };
    c.onmouseleave = () => { v.pause(); };
  });
}

/* ================================ router ================================ */
const NAV = [["home", "Home", "home"], ["templates", "Templates", "tpl"], ["references", "References", "ref"], ["renders", "Renders", "ren"], [null], ["ae", "After Effects", "ae"]];
function route() { const h = location.hash.replace(/^#\/?/, "") || "home"; const [page, ...rest] = h.split("/"); return { page, arg: decodeURIComponent(rest.join("/")) }; }
function go(h) { location.hash = "#/" + h; }
window.onhashchange = () => { window.scrollTo(0, 0); renderView(); };

function renderNav() {
  const { page } = route();
  const counts = { templates: D.templates.length, references: D.references.length, renders: D.renders.filter(r => r.kind !== "jsx").length };
  $("#nav").innerHTML = NAV.map(n => n[0] === null ? '<div class="sep"></div>'
    : `<a href="#/${n[0]}" class="${page === n[0] || (page === "compare" && n[0] === "renders") ? "on" : ""}">${ico(n[2])}${n[1]}${counts[n[0]] ? `<span class="count">${counts[n[0]]}</span>` : ""}</a>`).join("");
}
function crumbs(parts) { $("#crumbs").innerHTML = parts.map((p, i) => i === parts.length - 1 ? `<b>${esc(p[0])}</b>` : `<a href="#/${p[1]}">${esc(p[0])}</a><span style="color:var(--dim)">/</span>`).join(""); }

function renderView() {
  if (!D) return;
  renderNav();
  const { page, arg } = route();
  const v = $("#view");
  const views = { home: viewHome, templates: arg ? viewTemplate : viewTemplates, references: arg ? viewReference : viewReferences, renders: viewRenders, compare: viewCompare, ae: viewAE };
  v.innerHTML = `<div class="page">${(views[page] || viewHome)(arg)}</div>`;
  wireHover(v);
  (afterRender[page] || (() => {}))(arg);
  updateCmpBar();
}
const afterRender = {};

/* ================================ Home ================================ */
function viewHome() {
  crumbs([["Home"]]);
  const latest = D.renders.filter(r => r.kind === "mp4" && !r.file.includes("silent")).slice(0, 4);
  return `
  <div class="hero">
    <h1>What are we making today?</h1>
    <p>Paste a link to any motion video and Motion Lab breaks it into story sections, frame sheets and colours, ready to rebuild. Or start from one of your templates.</p>
    ${pasteBar("home")}
    <div class="hint"><span><b>Works with</b> YouTube · Instagram · X · Vimeo · any .mp4</span><span><b>Tip</b> drag a video file anywhere on this page</span></div>
    <div id="homeJob"></div>
  </div>
  <div class="sec"><div class="sec-h"><h2>Start from a template</h2><a class="more" href="#/templates">All templates →</a></div>
    <div class="grid sm">${D.templates.filter(t => t.status !== "superseded").slice(0, 4).map(tplCard).join("")}</div></div>
  <div class="sec"><div class="sec-h"><h2>Latest renders</h2><a class="more" href="#/renders">All renders →</a></div>
    <div class="grid sm">${latest.map(renderCard).join("") || '<div class="empty">Nothing rendered yet.</div>'}</div></div>
  <div class="sec"><div class="sec-h"><h2>Recent references</h2><a class="more" href="#/references">All references →</a></div>
    <div class="grid sm">${D.references.slice(0, 4).map(refCard).join("")}</div></div>`;
}
afterRender.home = () => wirePaste("home");

/* ================================ Paste / analyse flow ================================ */
function pasteBar(id) {
  return `<div class="paste"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E78" stroke-width="1.8">${ICON.link}</svg>
    <input id="paste-${id}" placeholder="Paste a video link, or a path to a file on this Mac" autocomplete="off" />
    <span class="or">or</span><label class="btn sm ghost" style="cursor:pointer">Choose file<input type="file" accept="video/*" hidden id="file-${id}"></label>
    <button class="btn primary" id="go-${id}">Analyse</button></div>`;
}
function wirePaste(id) {
  const inp = $("#paste-" + id), go_ = $("#go-" + id), file = $("#file-" + id);
  if (!inp) return;
  const start = () => { const v = inp.value.trim(); if (v) analyse(v, id); };
  go_.onclick = start; inp.onkeydown = e => { if (e.key === "Enter") start(); };
  file.onchange = () => file.files[0] && uploadAndAnalyse(file.files[0], id);
}
const STAGES = [["download", "Downloading"], ["frames", "Reading frames"], ["cuts", "Finding cuts"], ["sections", "Story sections"], ["done", "Ready"]];
async function analyse(src, slot) {
  const { job } = await (await fetch("/api/analyze", { method: "POST", body: JSON.stringify({ src }) })).json();
  WATCH.set(job, { kind: "analyze", label: src.split("?")[0].split("/").pop() || src, slot, link: /^https?:/.test(src) });
  pollJobs();
}
async function uploadAndAnalyse(f, slot) {
  toast(`Uploading ${f.name}…`);
  const r = await (await fetch("/api/upload", { method: "POST", headers: { "X-Filename": encodeURIComponent(f.name) }, body: f })).json();
  analyse(r.path, slot);
}
function stepper(j, info) {
  const st = j.stage || "starting"; const list = info.link ? STAGES : STAGES.slice(1);
  const idx = list.findIndex(s => s[0] === st);
  return `<div class="stepper">${list.map((s, i) => `<div class="step ${j.done && j.ok ? "done" : i < idx ? "done" : i === idx ? "now" : ""}">
      ${i === idx && !j.done ? '<span class="spin"></span>' : (i < idx || (j.done && j.ok)) ? "✓ " : ""}${s[1]}</div>`).join("")}</div>
    ${j.done && !j.ok ? `<div class="errbox"><b>Couldn't analyse that.</b> ${esc(friendlyError(j.error))}</div>` : ""}`;
}
function friendlyError(e = "") {
  if (/403|Forbidden|Sign in|private/i.test(e)) return "The site refused the download (private, age-restricted or rate-limited). Try another link, or download the video and drop the file here.";
  if (/not found/i.test(e)) return "That file path doesn't exist on this Mac.";
  if (/Unsupported URL|no video/i.test(e)) return "That page has no video Motion Lab can read. Paste the direct video link.";
  return e || "Something went wrong. Open the log below for details.";
}

/* ================================ Jobs tray + toasts ================================ */
let polling = null;
function pollJobs() {
  if (polling) return;
  polling = setInterval(async () => {
    const jobs = await (await fetch("/api/jobs")).json();
    for (const id of WATCH.keys()) if (!jobs.find(j => j.id === id)) { const r = await (await fetch("/api/job/" + id)).json(); jobs.push({ ...r, id }); }
    drawTray(jobs);
    for (const j of jobs) {
      const w = WATCH.get(j.id); if (!w) continue;
      const slot = w.slot && $(`#${w.slot === "home" ? "homeJob" : "refJob"}`);
      if (slot) slot.innerHTML = w.kind === "analyze" ? stepper(j, w) : "";
      if (j.done) {
        WATCH.delete(j.id);
        await reload();
        if (w.kind === "analyze") j.ok ? toast(`Reference ready`, j.ref ? `#/references/${encodeURIComponent(j.ref)}` : "#/references", "Open") : toast(`Analysis failed: ${friendlyError(j.error).split(".")[0]}`, null, null, true);
        if (w.kind === "render") j.ok ? toast(`Render finished: ${w.label}`, "#/renders", "Watch") : toast(`Render failed: ${w.label}`, null, null, true);
        if (w.onDone) w.onDone(j);
      }
    }
    if (!WATCH.size && !jobs.some(j => !j.done)) { clearInterval(polling); polling = null; setTimeout(() => drawTray([]), 4000); }
  }, 1200);
}
function drawTray(jobs) {
  const live = jobs.filter(j => !j.done);
  $("#tray").querySelectorAll(".job").forEach(e => e.remove());
  $("#tray").insertAdjacentHTML("afterbegin", live.map(j => `<div class="job"><div class="r"><span class="spin"></span><b>${esc(j.label || j.kind)}</b>
      <span class="mono" style="color:var(--dim);font-size:11.5px">${dur(Date.now() / 1000 - (j.started || Date.now() / 1000))}</span></div>
      <div class="s">${esc(j.kind === "analyze" ? (STAGES.find(s => s[0] === j.stage)?.[1] || "Starting") : j.stage || "Working")}…</div><div class="bar"><i></i></div></div>`).join(""));
}
function toast(msg, href, cta, bad) {
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : "");
  t.innerHTML = `<span class="dot"></span><span>${esc(msg)}</span>${href ? `<a href="${href}">${cta}</a>` : ""}`;
  $("#tray").appendChild(t); setTimeout(() => { t.style.opacity = 0; t.style.transition = "opacity .4s"; setTimeout(() => t.remove(), 400); }, 6000);
}

/* ================================ Templates ================================ */
let TFILTER = "all";
function tplCard(t) {
  const tv = D.template_videos[t.id] || {}; const prev = D.previews[t.id];
  const curated = prev && /\.(jpg|png)$/.test(prev) ? prev : null;
  const poster = curated || D.previews[t.id + ":poster"] || tv.thumb;
  const video = tv.video || (prev && prev.endsWith(".mp4") ? prev : null);
  return `<a class="card" href="#/templates/${t.id}">${media({ poster, video, d: t.duration })}
    <div class="info"><div class="t">${esc(t.title)}</div>
      <div class="m">${t.size ? `${t.size[0]}×${t.size[1]}` : ""}<span>${t.fps} fps</span>${t.status === "verified" ? '<span class="pill ok">✓ Verified</span>' : t.status === "superseded" ? '<span class="pill old">Older version</span>' : ""}</div></div></a>`;
}
function viewTemplates() {
  crumbs([["Templates"]]);
  const q = $("#q").value.toLowerCase();
  const filters = [["all", "All"], ["sequence", "Films & promos"], ["overlay", "Overlays"], ["verified", "Verified"]];
  const list = D.templates.filter(t => (TFILTER === "all" || t.kind === TFILTER || (TFILTER === "verified" && t.status === "verified"))
    && (!q || (t.title + " " + t.id + " " + (t.tags || []).join(" ")).toLowerCase().includes(q)));
  return `<h1>Templates</h1><p class="sub">Every film and overlay rebuilt in Motion Lab. Hover to preview, open one to customise and render.</p>
    <div class="chips" style="margin:20px 0 22px">${filters.map(f => `<button class="chip ${TFILTER === f[0] ? "on" : ""}" onclick="TFILTER='${f[0]}';renderView()">${f[1]}</button>`).join("")}</div>
    <div class="grid">${list.map(tplCard).join("") || '<div class="empty">No templates match.</div>'}</div>
    <div class="sec"><div class="sec-h"><h2>Reusable motion blocks</h2></div><div class="tags">${(D.blocks || []).map(b => `<span class="tag">${esc(b.id)}</span>`).join("")}</div></div>`;
}

function aeBlock(id) {
  const files = D.renders.filter(r => r.project === id && ["zip", "jsx"].includes(r.kind));
  if (!D.ae_builders.includes(id)) return `<div class="aebox"><div class="h"><i>Ae</i>After Effects</div>
    <p class="sub" style="font-size:12.5px;margin:8px 0 10px">This one doesn't have an After Effects version yet. Ask below and Claude will build one.</p>
    <button class="btn sm ghost" onclick="$('#askText').value='Build an editable After Effects version of this template (live text, shape layers, keyframes) and give me the .zip';$('#askText').focus()">Ask Claude to build it</button></div>`;
  return `<div class="aebox"><div class="h"><i>Ae</i>After Effects project</div>
    <p class="sub" style="font-size:12.5px;margin:8px 0 10px">An editable comp: live text, shape layers, masks and keyframes, as a .jsx script plus its assets. Install the fonts in <span class="mono">_assets/fonts</span> before opening it.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" id="aeGo">${ico("dl", 14)} Download AE project</button><button class="btn sm ghost" id="aeCheck">Check without AE</button></div>
    <div id="aeOut"></div>
    ${files.length ? `<div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">${files.slice(0, 4).map(f => `<a href="${f.url}" download style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)"><span>${ico("dl", 13)} ${esc(f.file)}</span><span>${ago(f.mtime)}</span></a>`).join("")}</div>` : ""}</div>`;
}
function versionsOf(id) {                          // the film itself first (newest first), breakdowns and stems after
  const vs = D.renders.filter(r => r.project === id && (r.kind === "mp4" || r.kind === "mov"));
  const aux = r => /breakdown|silent|_part/.test(r.file) ? 1 : 0;
  return vs.sort((a, b) => aux(a) - aux(b) || b.mtime - a.mtime);
}
function viewTemplate(id) {
  const t = tplById(id); if (!t) return `<div class="empty">Template not found.</div>`;
  crumbs([["Templates", "templates"], [t.title.split(":")[0].split("(")[0].trim()]]);
  const vs = versionsOf(id); const tv = D.template_videos[id] || {}; const prev = D.previews[id];
  const main = vs[0]?.url || tv.video || (prev && prev.endsWith(".mp4") ? prev : null);
  const ps = Object.entries(t.params || {}).filter(([k]) => !k.startsWith("$"));
  const field = ([k, s]) => s.type === "enum" ? `<label class="field"><span>${esc(k)}</span><select data-p="${k}">${s.options.map(o => `<option ${o === s.default ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`
    : s.type === "boolean" ? `<label class="field"><span>${esc(k)}</span><select data-p="${k}"><option ${s.default ? "selected" : ""}>true</option><option ${!s.default ? "selected" : ""}>false</option></select></label>`
    : `<label class="field"><span>${esc(k)}${s.note ? ` · ${esc(s.note)}` : ""}</span><input data-p="${k}" value="${esc(s.default ?? "")}" /></label>`;
  const ask = `In Motion Lab, update the "${t.id}" template: `;
  return `<div class="detail">
    <div>
      <div class="player"><video id="tplPlayer" ${main ? `src="${main}"` : ""} controls loop autoplay muted playsinline></video></div>
      ${vs.length ? `<div style="display:flex;align-items:center;gap:10px;margin-top:18px"><h2>Versions</h2><span class="sub" style="font-size:13px">${vs.length} render${vs.length > 1 ? "s" : ""}, newest first</span></div>
      <div class="versions">${vs.map((r, i) => `<div class="ver ${i === 0 ? "on" : ""}" data-url="${r.url}"><img src="${r.thumb}" loading="lazy"><div><b style="color:var(--ink);font-weight:550">${esc(r.file.replace(/\.\w+$/, "").replace(/^.*?(v\d+|breakdown)$/, "$1") || r.file)}</b> · ${ago(r.mtime)}</div></div>`).join("")}</div>` : ""}
      <div class="sec" style="margin-top:22px"><h1 style="font-size:22px">${esc(t.title)}</h1>
        <p class="sub" style="margin:8px 0 14px;max-width:780px">${esc(t.source?.note || "")}</p>
        <div class="tags">${(t.tags || []).map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div></div>
    </div>
    <div class="panel">
      <h3>Customise and render</h3><p class="sub">${ps.length ? "Change the fields, pick a format, render. The result plays on the left." : "This film's words and photos live in its code, so there are no fields here yet."}</p>
      ${!ps.length && vs[0] ? `<a class="btn primary" style="width:100%;justify-content:center;height:44px;margin-bottom:10px" href="${vs[0].url}" download>${ico("dl", 16)} Download latest film</a>` : ""}
      ${!ps.length && vs.find(r => r.file.includes("breakdown")) ? `<button class="btn ghost" style="width:100%;justify-content:center;margin-bottom:6px" onclick="openPlayer('${vs.find(r => r.file.includes("breakdown")).file}')">${ico("cmp", 16)} Watch the reference breakdown</button>` : ""}
      ${ps.length ? ps.map(field).join("") : ""}
      ${ps.length ? `<div class="field"><span>Format</span><div class="seg" id="fmt">
        <button data-f="mp4" class="on">MP4</button><button data-f="mov">MOV alpha</button><button data-f="gif">GIF</button><button data-f="png-sequence">PNG seq</button></div>
        <div class="sub" id="fmtHint" style="font-size:12px;margin-top:7px">Flat video for social and the web.</div></div>
      <button class="btn primary" id="renderGo" style="width:100%;justify-content:center;height:44px;margin-top:6px">Render</button>
      <div id="renderJob" style="margin-top:12px"></div>` : ""}
      ${aeBlock(id)}
      ${askPanel("template", id, ps.length ? ["Change the name and title", "Make it 9:16 for Reels", "Use our brand colours"] : ["Change the end text", "Swap a photo", "Make it 15 seconds shorter", "Make a 9:16 version", ...(D.ae_builders.includes(id) ? [] : ["Build an After Effects version"])])}
      <dl class="kv" style="margin-top:18px"><dt>Duration</dt><dd>${dur(t.duration)}</dd><dt>Size</dt><dd>${t.size ? t.size.join(" × ") : "-"}</dd><dt>Frame rate</dt><dd>${t.fps} fps</dd><dt>Engine</dt><dd>${esc(t.engine || "")}</dd></dl>
    </div></div>`;
}
afterRender.templates = id => {
  if (!id) return;
  wireAsk("template", id);
  $$(".ver").forEach(v => v.onclick = () => { $$(".ver").forEach(x => x.classList.remove("on")); v.classList.add("on"); const p = $("#tplPlayer"); p.src = v.dataset.url; p.play(); });
  const HINT = { mp4: "Flat video for social and the web.", mov: "ProRes 4444 with transparency, for Premiere / Final Cut.", gif: "Small looping preview for docs and PRs.", "png-sequence": "Numbered RGBA frames for AE, Nuke or Fusion." };
  let fmt = "mp4";
  $$("#fmt button").forEach(b => b.onclick = () => { $$("#fmt button").forEach(x => x.classList.remove("on")); b.classList.add("on"); fmt = b.dataset.f; $("#fmtHint").textContent = HINT[fmt]; });
  const params = () => Object.fromEntries($$("[data-p]").map(e => [e.dataset.p, e.value]));
  if ($("#renderGo")) $("#renderGo").onclick = async () => {
    $("#renderGo").disabled = true;
    const { job } = await (await fetch("/api/render", { method: "POST", body: JSON.stringify({ id, params: params(), format: fmt }) })).json();
    $("#renderJob").innerHTML = `<div class="sub" style="font-size:13px;margin-bottom:8px"><span class="spin" style="display:inline-block;vertical-align:-2px;margin-right:8px"></span>Rendering…</div><div class="bar"><i></i></div>`;
    WATCH.set(job, { kind: "render", label: tplById(id).title.split(":")[0], onDone: j => {
      $("#renderGo") && ($("#renderGo").disabled = false);
      if (!$("#renderJob")) return;
      if (j.ok && j.url) { $("#renderJob").innerHTML = `<a class="btn sm ghost" href="${j.url}" download>${ico("dl", 15)} Download</a>`; const p = $("#tplPlayer"); if (p && j.url.endsWith(".mp4")) { p.src = j.url; p.play(); } }
      else $("#renderJob").innerHTML = `<div class="errbox">Render failed. <details style="border:0;padding:0;margin:6px 0 0"><summary style="font-weight:500">Log</summary><pre class="log">${esc((j.log || []).slice(-30).join("\n"))}</pre></details></div>`;
    } });
    pollJobs();
  };
  const aeJob = async (url, body) => {
    $("#aeOut").innerHTML = `<div class="bar" style="margin-top:12px"><i></i></div>`;
    const { job } = await (await fetch(url, { method: "POST", body: JSON.stringify(body) })).json();
    WATCH.set(job, { kind: "ae", label: "After Effects build", onDone: j => {
      const fr = (D.scene_previews || {})[id] || [];
      if (j.ok && j.url && !url.includes("check")) { const a = document.createElement("a"); a.href = j.url; a.download = ""; document.body.appendChild(a); a.click(); a.remove(); }
      $("#aeOut").innerHTML = j.ok ? `${j.url ? `<a class="btn sm ghost" style="margin-top:12px" href="${j.url}" download>${ico("dl", 15)} ${esc(j.url.split("/").pop())}</a>` : `<p class="sub" style="margin-top:10px">Check passed.</p>`}
        ${url.includes("check") && fr.length ? `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px">${fr.map(f => `<img src="${f}?t=${Date.now()}" style="width:100%;border-radius:6px">`).join("")}</div>` : ""}`
        : `<div class="errbox">Failed.<pre class="log">${esc((j.log || []).slice(-20).join("\n"))}</pre></div>`;
    } });
    pollJobs();
  };
  if ($("#aeGo")) $("#aeGo").onclick = () => aeJob("/api/after-effects", { id, params: params() });
  if ($("#aeCheck")) $("#aeCheck").onclick = () => aeJob("/api/ae-check", { id });
};

/* ================================ References ================================ */
function refCard(r) {
  const d = r.seconds || (r.sections?.length ? r.sections.at(-1).end : null);
  return `<a class="card" href="#/references/${encodeURIComponent(r.name)}">${media({ poster: r.poster, video: r.video, d, none: r.complete ? "no poster" : "analysis incomplete" })}
    <div class="info"><div class="t">${esc(r.title)}</div>
      <div class="m">${r.sections?.length ? `<span>${r.sections.length} sections</span>` : r.scenes ? `<span>${r.scenes.length} scenes</span>` : ""}${r.size ? `<span>${r.size[0]}×${r.size[1]}</span>` : ""}
        <span class="palette">${(r.palette || []).slice(0, 6).map(c => `<i style="background:${c}"></i>`).join("")}</span></div></div></a>`;
}
function viewReferences() {
  crumbs([["References"]]);
  const q = $("#q").value.toLowerCase();
  const list = D.references.filter(r => !q || (r.title + " " + r.name).toLowerCase().includes(q));
  return `<h1>References</h1><p class="sub">Videos you're studying. Each one is split into story sections with frame sheets and its colour palette.</p>
    <div style="margin:22px 0 28px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:20px">${pasteBar("ref")}<div id="refJob"></div></div>
    <div class="grid">${list.map(refCard).join("") || '<div class="empty">No references yet: paste a link above.</div>'}</div>`;
}
function viewReference(name) {
  const r = D.references.find(x => x.name === name); if (!r) return `<div class="empty">Reference not found.</div>`;
  crumbs([["References", "references"], [r.title]]);
  const secs = r.sections?.length ? r.sections : (r.scenes || []).map(([s, e], i) => ({ n: i + 1, start: (s - 1) / (r.fps || 30), end: (e - 1) / (r.fps || 30) }));
  const total = secs.length ? secs.at(-1).end : (r.seconds || 1);
  return `<div class="detail">
    <div>
      <div class="player">${r.video ? `<video id="refPlayer" src="${r.video}" controls playsinline preload="metadata"></video>` : `<img src="${r.overview || r.poster}" style="width:100%;display:block">`}</div>
      ${secs.length ? `<div class="tline" id="tline">${secs.map(s => `<button data-s="${s.start}" data-e="${s.end}" style="flex:${Math.max(.2, s.end - s.start)}" title="Section ${s.n} · ${s.start.toFixed(1)}–${s.end.toFixed(1)}s"><i></i><span>${s.n}</span></button>`).join("")}</div>` : ""}
      ${r.sections?.length ? `<div class="sec"><div class="sec-h"><h2>Story sections</h2><span class="sub" style="font-size:13px">12 frames per section. Click a sheet to enlarge, or jump the player to it</span></div>
        <div class="secs">${r.sections.map(s => `<div class="seccard" id="sec-${s.n}"><div class="h"><b>Section ${s.n}</b><span class="mono">${s.start.toFixed(2)}–${s.end.toFixed(2)}s · ${(s.end - s.start).toFixed(1)}s</span>
          <button onclick="seekRef(${s.start})">▶ Play from here</button></div>${s.sheet ? `<img src="${s.sheet}" loading="lazy" onclick="zoomImg('${s.sheet}')">` : ""}</div>`).join("")}</div></div>` : ""}
      ${r.sheets?.length ? `<details class="sec"><summary>Frame-by-frame sheets <span class="sub" style="font-size:13px;font-weight:400">every 2nd frame · ${r.sheets.length} sheets</span></summary>
        <div style="display:grid;gap:12px;margin-top:14px">${r.sheets.map(s => `<img src="${s}" loading="lazy" style="width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in" onclick="zoomImg('${s}')">`).join("")}</div></details>` : ""}
    </div>
    <div class="panel">
      <h3>${esc(r.title)}</h3>${r.link ? `<a class="sub" style="display:flex;gap:6px;align-items:center;font-size:12.5px;margin-bottom:16px;word-break:break-all" href="${esc(r.link)}" target="_blank">${ico("link", 14)} ${esc(r.link.replace(/^https?:\/\//, "").slice(0, 46))}</a>` : '<div style="height:12px"></div>'}
      <dl class="kv"><dt>Length</dt><dd>${dur(total)}</dd><dt>Size</dt><dd>${r.size ? r.size.join(" × ") : "-"}</dd><dt>Frame rate</dt><dd>${r.fps ? (+r.fps).toFixed(2) : "-"} fps</dd>
        <dt>Story sections</dt><dd>${r.sections?.length || "-"}</dd><dt>Hard cuts</dt><dd>${r.cuts?.length ?? "-"}</dd></dl>
      ${r.palette?.length ? `<details open><summary>Palette</summary><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px">${r.palette.map(c => `<button onclick="navigator.clipboard.writeText('${c}');toast('Copied ${c}')" style="text-align:left"><div style="height:44px;border-radius:9px;background:${c};box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)"></div><div class="mono" style="font-size:11px;color:var(--mute);margin-top:5px">${c}</div></button>`).join("")}</div></details>` : ""}
      ${r.overview ? `<details><summary>Whole-film overview</summary><img src="${r.overview}" style="width:100%;border-radius:9px;margin-top:12px;cursor:zoom-in" onclick="zoomImg('${r.overview}')"></details>` : ""}
      ${askPanel("reference", r.name, ["Build a 9:16 video in this style about our product", "List the techniques used in each section", "Make a version of this for my brand"])}
    </div></div>`;
}
afterRender.references = name => {
  if (!name) { wirePaste("ref"); return; }
  wireAsk("reference", name);
  const p = $("#refPlayer"), tl = $("#tline"); if (!p || !tl) return;
  const btns = [...tl.querySelectorAll("button")];
  btns.forEach(b => b.onclick = () => { p.currentTime = +b.dataset.s + .01; p.play(); });
  p.ontimeupdate = () => btns.forEach((b, i) => {
    const s = +b.dataset.s, e = +b.dataset.e, on = p.currentTime >= s && p.currentTime < e;
    b.classList.toggle("on", on); b.querySelector("i").style.width = on ? `${(p.currentTime - s) / (e - s) * 100}%` : (p.currentTime >= e ? "100%" : "0");
    const card = $("#sec-" + (i + 1)); if (card) card.classList.toggle("on", on);
  });
};
window.seekRef = t => { const p = $("#refPlayer"); if (p) { p.currentTime = t + .01; p.play(); window.scrollTo({ top: 0, behavior: "smooth" }); } };
window.zoomImg = src => { $("#modalBox").innerHTML = `<img class="full" src="${src}">`; $("#modal").classList.add("on"); };

/* ================================ Renders ================================ */
function renderCard(r) {
  const sel = SEL.has(r.file);
  return `<div class="card" data-file="${esc(r.file)}" onclick="openPlayer('${esc(r.file)}')">
    ${r.kind === "mp4" || r.kind === "mov" ? `<span class="sel ${sel ? "on" : ""}" onclick="event.stopPropagation();toggleSel('${esc(r.file)}')">${sel ? "✓" : ""}</span>` : ""}
    ${media({ poster: r.thumb, video: r.kind === "mp4" ? r.url : null, d: r.duration, none: r.kind.toUpperCase() })}
    <div class="info"><div class="t">${esc(r.title)}</div><div class="m"><span>${ago(r.mtime)}</span><span>${mb(r.size)}</span>${r.w ? `<span>${r.w}×${r.h}</span>` : ""}
      <a class="btn sm ghost" style="margin-left:auto;height:28px" href="${r.url}" download onclick="event.stopPropagation()">${ico("dl", 14)}</a></div></div></div>`;
}
let RKIND = "video";
function viewRenders() {
  crumbs([["Renders"]]);
  const q = $("#q").value.toLowerCase();
  const list = D.renders.filter(r => (RKIND === "all" || (RKIND === "video" ? ["mp4", "mov", "gif"].includes(r.kind) : ["jsx", "zip"].includes(r.kind))) && (!q || (r.file + " " + r.project).toLowerCase().includes(q)));
  const groups = {}; list.forEach(r => (groups[r.project] ||= []).push(r));
  return `<h1>Renders</h1><p class="sub">Everything Motion Lab has made, grouped by project. Hover to preview, click to watch, tick two to compare them in sync.</p>
    <div class="chips" style="margin:20px 0 6px">${[["video", "Videos"], ["ae", "After Effects files"], ["all", "Everything"]].map(f => `<button class="chip ${RKIND === f[0] ? "on" : ""}" onclick="RKIND='${f[0]}';renderView()">${f[1]}</button>`).join("")}</div>
    ${Object.entries(groups).map(([p, rs]) => `<div class="sec"><div class="sec-h"><h2>${esc(projTitle(p))}</h2><span class="sub" style="font-size:13px">${rs.length} file${rs.length > 1 ? "s" : ""}</span>
      ${tplById(p) ? `<a class="more" href="#/templates/${p}">Open project →</a>` : ""}</div><div class="grid sm">${rs.map(renderCard).join("")}</div></div>`).join("") || '<div class="empty" style="margin-top:20px">Nothing here yet.</div>'}`;
}
window.toggleSel = f => { if (SEL.has(f)) SEL.delete(f); else { if (SEL.size >= 2) SEL.delete([...SEL][0]); SEL.add(f); } renderView(); };
function updateCmpBar() {
  const n = SEL.size; $("#cmpbar").classList.toggle("on", n > 0 && route().page === "renders");
  $("#cmptext").textContent = n === 1 ? "Pick one more video to compare" : `${n} videos selected`;
  $("#cmpgo").disabled = n !== 2;
}
$("#cmpgo").onclick = () => { const [a, b] = [...SEL]; go(`compare/${encodeURIComponent(a)}|${encodeURIComponent(b)}`); };
window.openPlayer = file => {
  const r = D.renders.find(x => x.file === file); if (!r) return;
  if (!["mp4", "mov", "gif"].includes(r.kind)) { location.href = r.url; return; }
  $("#modalBox").innerHTML = `<div class="bar2"><b>${esc(r.title)}</b><span class="sub" style="font-size:12.5px">← → step a frame · space play</span>
      <a class="btn sm ghost" href="${r.url}" download>${ico("dl", 14)} Download</a><button class="btn sm ghost" onclick="closeModal()">Close</button></div>
    ${r.kind === "gif" ? `<img class="full" src="${r.url}">` : `<div class="player"><video id="lb" src="${r.url}" controls autoplay playsinline></video></div>`}`;
  $("#modal").classList.add("on");
};
window.closeModal = () => { $("#modal").classList.remove("on"); $("#modalBox").innerHTML = ""; };
$("#modal").onclick = e => { if (e.target.id === "modal") closeModal(); };

/* ================================ Compare ================================ */
function viewCompare(arg) {
  const [a, b] = arg.split("|").map(decodeURIComponent).map(f => D.renders.find(r => r.file === f));
  crumbs([["Renders", "renders"], ["Compare"]]);
  if (!a || !b) return `<div class="empty">Pick two videos on the Renders page.</div>`;
  return `<h1>Compare</h1><p class="sub">Both videos play in lockstep from one control. Arrow keys step a frame.</p>
    <div class="cmp" style="margin-top:20px">${[a, b].map((r, i) => `<div><div class="lbl">${i ? "B" : "A"} · ${esc(r.file)} · ${dur(r.duration)}</div><div class="player"><video id="cv${i}" src="${r.url}" playsinline preload="auto"></video></div></div>`).join("")}</div>
    <div class="ctrl"><button class="btn sm primary" id="cplay">Play</button><span class="mono" id="ctime" style="width:96px;color:var(--mute)">0:00</span>
      <input type="range" id="cseek" min="0" max="1000" value="0"><div class="seg" id="cspeed" style="width:150px"><button data-s=".5">0.5×</button><button data-s="1" class="on">1×</button></div>
      <button class="btn sm ghost" onclick="SEL.clear();go('renders')">Done</button></div>`;
}
afterRender.compare = () => {
  const v = [$("#cv0"), $("#cv1")]; if (!v[0]) return;
  const len = () => Math.max(v[0].duration || 0, v[1].duration || 0);
  let playing = false;
  $("#cplay").onclick = () => { playing = !playing; v.forEach(x => playing ? x.play() : x.pause()); $("#cplay").textContent = playing ? "Pause" : "Play"; };
  v[0].ontimeupdate = () => { if (!$("#ctime")) return; const t = v[0].currentTime; if (Math.abs(v[1].currentTime - t) > .08) v[1].currentTime = t;
    $("#ctime").textContent = `${dur(t)} / ${dur(len())}`; $("#cseek").value = len() ? t / len() * 1000 : 0; };
  $("#cseek").oninput = e => { const t = e.target.value / 1000 * len(); v.forEach(x => x.currentTime = t); };
  $$("#cspeed button").forEach(b => b.onclick = () => { $$("#cspeed button").forEach(x => x.classList.remove("on")); b.classList.add("on"); v.forEach(x => x.playbackRate = +b.dataset.s); });
};

/* ================================ After Effects ================================ */
function viewAE() {
  crumbs([["After Effects"]]);
  const fb = D.ae_feedback || { sheets: [], logs: [], renders: [] };
  return `<h1>After Effects</h1><p class="sub">Templates with an AE exporter build an editable comp from the template page. When AE reports a problem, paste it here so the exporter can be fixed.</p>
    <div class="panel" style="position:static;margin:22px 0;max-width:860px"><h3>Send back what After Effects said</h3>
      <p class="sub">Running a generated .jsx writes <span class="mono">motion-lab-ae.log</span> next to it. Paste it, or any error dialog text.</p>
      <label class="field"><span>Name</span><input id="logname" placeholder="promo-run-2.log"></label>
      <label class="field"><span>Log</span><textarea id="logtext" rows="7" placeholder="Paste the log or the AE dialog text"></textarea></label>
      <button class="btn primary" id="logsave">Save feedback</button></div>
    <div class="grid sm">${[...fb.renders.map(r => `<div class="card" style="cursor:default"><div class="media"><video src="${r.url}" controls preload="metadata" style="opacity:1"></video></div><div class="info"><div class="t">${esc(r.name)}</div><div class="m">render sent back from AE</div></div></div>`),
      ...fb.logs.map(l => `<div class="card" style="cursor:default"><div class="info"><div class="t">${esc(l.name)}</div><pre class="log">${esc(l.text)}</pre></div></div>`),
      ...fb.sheets.map(s => `<div class="card" onclick="zoomImg('${s.url}')"><div class="media"><img src="${s.url}"></div><div class="info"><div class="t">${esc(s.name)}</div><div class="m">comparison sheet</div></div></div>`)].join("") || '<div class="empty">No feedback yet.</div>'}</div>`;
}
afterRender.ae = () => {
  $("#logsave").onclick = async () => {
    const text = $("#logtext").value.trim(); if (!text) return;
    const r = await (await fetch("/api/ae-log", { method: "POST", body: JSON.stringify({ name: $("#logname").value, text }) })).json();
    toast("Saved as " + r.saved); await reload();
  };
};


/* ================================ Assistant: talk to Claude Code from the UI ================================ */
function askPanel(kind, id, suggestions) {
  return `<div class="ask" id="ask"><h3><span class="spark"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg></span>Ask for changes</h3>
    <p class="sub" style="font-size:12.5px;margin:4px 0 0">${kind === "reference" ? "Describe what you want in plain words. Claude works on this Mac, builds or answers from this reference, and the result appears here." : "Describe what you want in plain words. Claude edits the template on this Mac, re-renders, and the new version appears here. Every change can be undone."}</p>
    <div id="signin"></div><div class="thread" id="thread"></div><div class="acts" id="acts"></div>
    <div class="sugg">${suggestions.map(x => `<button data-s="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <div class="composer"><textarea id="askText" placeholder="e.g. Change the last line to 'Built for pilots' and render a new version"></textarea>
      <button class="btn sm primary send" id="askSend">Send</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="sub" style="font-size:11.5px">⌘ Enter to send</span><button class="btn sm ghost" id="askUndo" hidden>Undo last change</button></div></div>`;
}
async function wireAsk(kind, id) {
  if (!$("#ask")) return;
  const draw = async () => {
    const th = await (await fetch(`/api/thread?kind=${kind}&id=${encodeURIComponent(id)}`)).json();
    $("#thread").innerHTML = th.messages.map(m => `<div class="msg ${m.role === "user" ? "user" : "bot"} ${m.ok === false ? "bad" : ""}">${esc(m.text)}</div>`).join("");
    $("#thread").scrollTop = 1e6;
    $("#askUndo").hidden = !th.messages.some(m => m.backup && !m.undone && m.ok);
  };
  draw();
  fetch("/api/claude-status").then(r => r.json()).then(c => {
    if (!c.signed_in) $("#signin").innerHTML = `<div class="signin">${c.installed ? `<b>Claude isn't signed in on this Mac.</b> Open Terminal once and run <code>claude auth login</code>, then come back. Your requests will work right away.`
      : `<b>Claude Code isn't installed on this Mac.</b> Install it from claude.com/code, then sign in.`}</div>`;
  });
  $$(".sugg button").forEach(b => b.onclick = () => { $("#askText").value = b.dataset.s; $("#askText").focus(); });
  const send = async () => {
    const message = $("#askText").value.trim(); if (!message) return;
    $("#askText").value = ""; $("#askSend").disabled = true;
    $("#thread").insertAdjacentHTML("beforeend", `<div class="msg user">${esc(message)}</div>`); $("#thread").scrollTop = 1e6;
    $("#acts").innerHTML = `<div>Thinking…</div>`;
    const { job } = await (await fetch("/api/ask", { method: "POST", body: JSON.stringify({ kind, id, message }) })).json();
    const tick = setInterval(async () => {
      const j = await (await fetch("/api/job/" + job)).json();
      const ev = (j.events || []);
      const steps = ev.filter(e => e.kind === "tool").slice(-5).map(e => `<div>${esc(e.text)}</div>`).join("");
      const said = ev.filter(e => e.kind === "text").slice(-1)[0];
      if ($("#acts")) $("#acts").innerHTML = steps + (said && !j.done ? `<div style="white-space:normal">${esc(said.text.slice(0, 160))}</div>` : "") || `<div>Thinking…</div>`;
      if (!j.done) return;
      clearInterval(tick);
      if (!$("#acts")) { toast(j.ok ? `Claude finished: ${id}` : `Claude couldn't finish: ${id}`, `#/${kind === "template" ? "templates" : "references"}/${encodeURIComponent(id)}`, "Open", !j.ok); await reload(); return; }
      $("#acts").innerHTML = ""; $("#askSend").disabled = false;
      await reload();                              // new renders / edits show up immediately
      toast(j.ok ? "Claude finished the change" : "Claude couldn't finish", null, null, !j.ok);
    }, 1200);
  };
  $("#askSend").onclick = send;
  $("#askText").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send(); };
  $("#askUndo").onclick = async () => {
    const r = await (await fetch("/api/ask/undo", { method: "POST", body: JSON.stringify({ kind, id }) })).json();
    toast(r.ok ? "Change undone" : "Nothing to undo", null, null, !r.ok); await reload();
  };
}

/* ================================ global: search, keys, drag & drop, boot ================================ */
$("#q").oninput = () => { const { page } = route(); if (!["templates", "references", "renders"].includes(page)) go("templates"); else renderView(); };
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); ($("#paste-home") || $("#paste-ref") || $("#q")).focus(); }
  if (e.key === "Escape") closeModal();
  const v = $("#lb") || (route().page === "compare" ? null : null);
  const vids = $("#lb") ? [$("#lb")] : route().page === "compare" ? [$("#cv0"), $("#cv1")] : [];
  if (vids.length && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !/input/i.test(document.activeElement.tagName)) {
    e.preventDefault(); vids.forEach(x => { x.pause(); x.currentTime = Math.max(0, x.currentTime + (e.key === "ArrowRight" ? 1 : -1) / 30); });
  }
  if (e.key === " " && $("#lb") && document.activeElement.tagName !== "INPUT") { e.preventDefault(); const x = $("#lb"); x.paused ? x.play() : x.pause(); }
});
let dragN = 0;
window.addEventListener("dragenter", e => { if ([...e.dataTransfer.types].includes("Files")) { dragN++; $("#drop").classList.add("on"); } });
window.addEventListener("dragleave", () => { if (--dragN <= 0) { dragN = 0; $("#drop").classList.remove("on"); } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault(); dragN = 0; $("#drop").classList.remove("on");
  const f = [...e.dataTransfer.files].find(x => x.type.startsWith("video/")); if (!f) return toast("That isn't a video file", null, null, true);
  if (!["home", "references"].includes(route().page)) go("references");
  setTimeout(() => uploadAndAnalyse(f, route().page === "home" ? "home" : "ref"), 50);
});
async function reload() { D = await (await fetch("/api/data")).json(); renderView(); }
reload().then(() => fetch("/api/jobs").then(r => r.json()).then(js => { if (js.some(j => !j.done)) pollJobs(); }));
</script>
</body>
